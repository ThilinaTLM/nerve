<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nerve — Git / PR panel mockups</title>
    <style>
      /* Nerve theme tokens (dark), copied from packages/ui-kit/src/styles/theme.css */
      :root {
        --background: oklch(0.264 0.018 80);
        --foreground: oklch(0.9 0.012 95);
        --card: oklch(0.289 0.02 82);
        --popover: oklch(0.305 0.02 82);
        --primary: oklch(0.6724 0.1308 38.8);
        --primary-foreground: oklch(0.1908 0.008 80);
        --muted: oklch(0.218 0.018 78);
        --muted-foreground: oklch(0.7713 0.017 99);
        --accent: oklch(0.21 0.022 78);
        --destructive: oklch(0.8 0.114 25.5);
        --success: oklch(0.78 0.176 149.2);
        --warning: oklch(0.828 0.16 70.1);
        --info: oklch(0.8 0.134 254.1);
        --border: oklch(0.353 0.022 82);
        --ring: oklch(0.6724 0.1308 38.8);
        --panel: oklch(0.228 0.02 70);
        --well: oklch(0.205 0.018 78);
        --radius: 0.375rem;
        --purple: oklch(0.78 0.12 310);
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --font-mono:
          ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 8px;
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
      .note {
        color: var(--muted-foreground);
        font-size: 12px;
        max-width: 70ch;
      }
      code {
        font-family: var(--font-mono);
        font-size: 0.92em;
      }

      /* ---------- page chrome ---------- */
      header.top {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--well);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .tabs button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 12px;
        padding: 3px 10px;
        border-radius: calc(var(--radius) - 2px);
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      }
      main {
        padding: 20px 16px 80px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .variants {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
      }
      .variant {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .variant > .label {
        font-size: 11px;
        color: var(--muted-foreground);
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .variant > .label b {
        color: var(--foreground);
        font-size: 12px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        font-size: 12px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      .panel-head .count {
        color: var(--muted-foreground);
        font-weight: 400;
      }
      .panel-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px;
      }

      /* ---------- primitives ---------- */
      svg {
        flex: none;
      }
      .icon {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon.sm {
        width: 12px;
        height: 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
        height: 18px;
        border-radius: calc(var(--radius) - 2px);
        font-size: 11px;
        font-weight: 500;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge.neutral {
        background: color-mix(in oklab, var(--muted) 80%, transparent);
        color: var(--muted-foreground);
        border-color: var(--border);
      }
      .badge.outline {
        border-color: var(--border);
        color: var(--muted-foreground);
      }
      .badge.success {
        background: color-mix(in oklab, var(--success) 14%, transparent);
        color: var(--success);
        border-color: color-mix(in oklab, var(--success) 30%, transparent);
      }
      .badge.danger {
        background: color-mix(in oklab, var(--destructive) 14%, transparent);
        color: var(--destructive);
        border-color: color-mix(in oklab, var(--destructive) 30%, transparent);
      }
      .badge.warn {
        background: color-mix(in oklab, var(--warning) 14%, transparent);
        color: var(--warning);
        border-color: color-mix(in oklab, var(--warning) 30%, transparent);
      }
      .badge.info {
        background: color-mix(in oklab, var(--info) 14%, transparent);
        color: var(--info);
        border-color: color-mix(in oklab, var(--info) 30%, transparent);
      }
      .badge.primary {
        background: color-mix(in oklab, var(--primary) 18%, transparent);
        color: var(--primary);
        border-color: color-mix(in oklab, var(--primary) 35%, transparent);
      }
      .mono {
        font-family: var(--font-mono);
      }
      .muted {
        color: var(--muted-foreground);
      }
      .sep {
        color: color-mix(in oklab, var(--muted-foreground) 55%, transparent);
      }
      .iconbtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      .iconbtn:hover {
        background: var(--muted);
        color: var(--foreground);
      }
      .iconbtn.active {
        color: var(--success);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        border-radius: calc(var(--radius) - 1px);
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
        cursor: pointer;
        font-family: inherit;
      }
      .btn:hover {
        background: var(--muted);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--muted-foreground);
      }
      .btn.ghost:hover {
        background: var(--muted);
        color: var(--foreground);
      }
      .btn.primary {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: transparent;
        font-weight: 500;
      }

      /* ---------- PR rows ---------- */
      .pr {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 8px;
        border-radius: var(--radius);
        background: var(--card);
        border: 1px solid transparent;
        cursor: pointer;
      }
      .pr:hover {
        border-color: var(--border);
        background: color-mix(in oklab, var(--card) 70%, var(--muted));
      }
      .pr .title {
        font-size: 12.5px;
        color: var(--foreground);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pr .title.one {
        -webkit-line-clamp: 1;
      }
      .pr .num {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--muted-foreground);
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted-foreground);
        min-width: 0;
      }
      .meta .grow {
        flex: 1;
        min-width: 0;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .state-open {
        color: var(--success);
      }
      .state-draft {
        color: var(--muted-foreground);
      }
      .state-merged {
        color: var(--purple);
      }
      .state-closed {
        color: var(--destructive);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 1px;
      }
      .hover-actions {
        opacity: 0;
        transition: opacity 90ms ease;
      }
      .pr:hover .hover-actions,
      .pr:focus-within .hover-actions {
        opacity: 1;
      }
      .float-actions {
        position: absolute;
        top: 4px;
        right: 4px;
        display: flex;
        gap: 1px;
        padding: 2px;
        border-radius: var(--radius);
        background: color-mix(in oklab, var(--popover) 92%, transparent);
        border: 1px solid var(--border);
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.35);
      }
      .stat-add {
        color: var(--success);
        font-family: var(--font-mono);
      }
      .stat-del {
        color: var(--destructive);
        font-family: var(--font-mono);
      }
      .current-rail {
        position: absolute;
        left: 0;
        top: 6px;
        bottom: 6px;
        width: 2px;
        border-radius: 2px;
        background: var(--primary);
      }

      /* ---------- repo switcher ---------- */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 7px;
        border-radius: calc(var(--radius) - 1px);
        border: 1px solid transparent;
        background: color-mix(in oklab, var(--well) 80%, transparent);
        color: var(--muted-foreground);
        font-size: 11.5px;
        font-family: var(--font-mono);
        cursor: pointer;
      }
      .chip:hover {
        background: var(--muted);
        color: var(--foreground);
      }
      .chip[aria-pressed="true"] {
        background: color-mix(in oklab, var(--primary) 18%, transparent);
        border-color: color-mix(in oklab, var(--primary) 45%, transparent);
        color: var(--foreground);
        font-weight: 500;
      }
      .chip .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--warning);
      }
      .chip .cnt {
        font-size: 10px;
        color: var(--muted-foreground);
      }
      .branchrow {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 4px;
        border-radius: var(--radius);
      }
      .branchbtn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        height: 24px;
        padding: 0 6px;
        border-radius: calc(var(--radius) - 1px);
        border: 1px solid transparent;
        background: transparent;
        color: var(--foreground);
        font-family: var(--font-mono);
        font-size: 12px;
        cursor: pointer;
      }
      .branchbtn:hover {
        background: var(--muted);
      }
      .toolrow {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 2px 4px 6px;
      }
      .divider {
        height: 1px;
        background: var(--border);
        opacity: 0.6;
      }

      /* ---------- PR detail ---------- */
      .detail {
        width: 100%;
        max-width: 1100px;
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .detail-head {
        padding: 12px 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .detail-title {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.3;
      }
      .segmented {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        background: var(--well);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .segmented button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 12px;
        height: 24px;
        padding: 0 9px;
        border-radius: calc(var(--radius) - 2px);
        cursor: pointer;
      }
      .segmented button[aria-selected="true"] {
        background: var(--card);
        color: var(--foreground);
      }
      .segmented .pill {
        font-size: 10.5px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--muted);
        color: var(--muted-foreground);
      }
      .detail-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
        gap: 16px;
        padding: 14px;
        background: var(--well);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 12px;
      }
      .side-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 2px 0 10px;
      }
      .side-block h3 {
        margin: 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted-foreground);
        font-weight: 600;
      }
      .status-card {
        border-radius: var(--radius);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .status-card.merged {
        background: color-mix(in oklab, var(--purple) 12%, transparent);
        border: 1px solid color-mix(in oklab, var(--purple) 30%, transparent);
      }
      .status-card.ready {
        background: color-mix(in oklab, var(--success) 10%, transparent);
        border: 1px solid color-mix(in oklab, var(--success) 28%, transparent);
      }
      .status-card.blocked {
        background: color-mix(in oklab, var(--destructive) 10%, transparent);
        border: 1px solid
          color-mix(in oklab, var(--destructive) 28%, transparent);
      }
      .status-card .row {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
      }
      .avatar {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--primary),
          color-mix(in oklab, var(--info) 70%, var(--primary))
        );
        font-size: 9px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-foreground);
        font-weight: 700;
      }
      .kbd-hint {
        font-size: 11px;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>Nerve · Git &amp; PR panel mockups</h1>
      <div class="tabs" role="tablist" id="pageTabs">
        <button role="tab" aria-selected="true" data-page="prlist">
          PR list card
        </button>
        <button role="tab" aria-selected="false" data-page="switcher">
          Repo switcher
        </button>
        <button role="tab" aria-selected="false" data-page="detail">
          PR detail
        </button>
      </div>
      <div class="toolbar">
        <label
          >panel width
          <input
            id="width"
            type="range"
            min="260"
            max="520"
            value="340"
            step="10"
        /></label>
        <span id="widthLabel" class="mono">340px</span>
        <label
          ><input id="forceHover" type="checkbox" /> show hover actions</label
        >
      </div>
    </header>

    <main>
      <section id="page-prlist"></section>
      <section id="page-switcher" hidden></section>
      <section id="page-detail" hidden></section>
    </main>

    <script>
      /* ------------------------------------------------------------------ */
      /* icons (lucide paths)                                                */
      /* ------------------------------------------------------------------ */
      const P = {
        "git-pull-request":
          '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/>',
        "git-pull-request-draft":

        folder:
          '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',

        "arrow-right": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
        "file-diff":
          '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="M9 15h6"/>',
        "arrow-down-up":
          '<path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/>',
        download:
          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
        upload:
          '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
        "circle-check":
          '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
        "circle-alert":
          '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
        eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
        tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>',
        users:
          '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
        history:
          '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',

      const ico = (n, cls = "icon") =>

                <div class="row muted"><b style="color:var(--foreground)">tlm</b> merged 12 commits into <code>main</code> on Sep 2</div>
                <div class="row muted">Merge commit <code>a91f3c2</code></div>
                <div style="display:flex;gap:6px"><button class="btn ghost">${ico("git-branch", "icon sm")} Delete branch</button><button class="btn ghost">${ico("external-link", "icon sm")} View on GitHub</button></div>
              </div>
            </div>
          </div>
        </div>

        <h2 style="margin-top:20px">Blocked PR — reasons instead of “unknown”</h2>
        <div class="detail">
          ${head({
            n: 286,
            title: "Add experimental GPUI workbench alpha",
            state: "draft",
            tone: "neutral",
            icon: "git-pull-request-draft",
            author: "tlm",
            verb: "opened this draft",
            when: "3 days ago",
            head: "feat/gpui-workbench-alpha",
            base: "main",
            add: 4821,
            del: 1290,
            files: 96,
            checkedOut: false,
          })}
          <div class="detail-body">
            <div class="card muted">Conversation timeline …</div>
            <div>
              <div class="status-card blocked">
                <div class="row" style="color:var(--destructive);font-weight:600">${ico("circle-alert", "icon sm")} Not ready to merge</div>
                <div class="row muted">${ico("x", "icon sm")} 2 of 15 checks failing</div>
                <div class="row muted">${ico("git-pull-request-draft", "icon sm")} Still a draft</div>
                <div class="row muted">${ico("arrow-down-up", "icon sm")} 8 commits behind <code>main</code></div>
              </div>
            </div>
          </div>
        </div>`;
        applyHover();
      }

      /* ------------------------------------------------------------------ */
      const pages = {
        prlist: renderPrList,
        switcher: renderSwitcher,
        detail: renderDetail,
      };
      let page =
        location.hash.slice(1) in pages ? location.hash.slice(1) : "prlist";
      document
        .querySelectorAll("#pageTabs button")
        .forEach((b) =>
          b.setAttribute("aria-selected", String(b.dataset.page === page)),
        );
      function render() {
        for (const key of Object.keys(pages)) {
          document.getElementById(`page-${key}`).hidden = key !== page;
        }
        pages[page]();
      }
      document.getElementById("pageTabs").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-page]");
        if (!btn) return;
        page = btn.dataset.page;
        document
          .querySelectorAll("#pageTabs button")
          .forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
        render();
      });
      document.getElementById("width").addEventListener("input", (e) => {
        state.width = Number(e.target.value);
        document.getElementById("widthLabel").textContent = `${state.width}px`;
        render();
      });
      document.getElementById("forceHover").addEventListener("change", (e) => {
        state.hover = e.target.checked;
        applyHover();
      });
      render();
    </script>
  </body>
</html>
