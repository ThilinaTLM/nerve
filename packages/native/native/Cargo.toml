[package]
name = "nerve-native"
version = "0.25.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.1", default-features = false, features = ["napi8"] }
napi-derive = "3.6.3"
gix = { version = "=0.86.0", default-features = false, features = [
  "status",
  "revision",
  "blob-diff",
  "attributes",
  "interrupt",
  "parallel",
  "sha1",
  "sha256",
] }
tokio = { version = "1.53.0", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[build-dependencies]
napi-build = "2.2.4"
