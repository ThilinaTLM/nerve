<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Before the theme bootstrap, which sets it to the theme's background. -->
    <meta name="theme-color" content="#272521" />
    <script>
      // Consumes the desktop shell hand-off parameters before anything paints:
      // the saved zoom level, and how far the shell already played the startup
      // intro so this document resumes that timeline instead of restarting it.
      (() => {
        const url = new URL(window.location.href);
        const consume = (parameter) => {
          const value = url.searchParams.get(parameter);
          if (value !== null) url.searchParams.delete(parameter);
          return value;
        };
        const rawLevel = consume("nerveInitialZoomLevel");
        const rawElapsed = consume("nerveSplashElapsedMs");
        if (rawLevel === null && rawElapsed === null) return;
        window.history.replaceState(
          {},
          "",
          `${url.pathname}${url.search}${url.hash}`,
        );

        const parsedLevel = Number(rawLevel);
        if (rawLevel !== null && Number.isInteger(parsedLevel)) {
          const level = Math.min(8, Math.max(-8, parsedLevel));
          const scale = 1.1 ** level;
          document.documentElement.style.setProperty(
            "--nerve-zoom-scale",
            scale.toFixed(4),
          );
          document.documentElement.style.setProperty(
            "--nerve-inverse-zoom-scale",
            (1 / scale).toFixed(4),
          );
          try {
            window.sessionStorage.setItem(
              "nerve.initialZoomLevel",
              String(level),
            );
          } catch {
            // The CSS variable is already applied; storage is only for app state.
          }
        }

        const parsedElapsed = Number(rawElapsed);
        if (rawElapsed !== null && Number.isFinite(parsedElapsed)) {
          const elapsed = Math.min(
            10000,
            Math.max(0, Math.round(parsedElapsed)),
          );
          document.documentElement.style.setProperty(
            "--splash-t0",
            `-${elapsed}ms`,
          );
        }
      })();
    </script>
    <script>
      // Applies the stored theme before the stylesheet loads so the startup
      // splash matches the workspace. Mirrors `migrateStoredTheme` in
      // src/lib/platform/appearance/theme-preference.ts, including the one-time
      // migration from the light/dark/colour-mode keys.
      (() => {
        const storage = (() => {
          try {
            return window.localStorage;
          } catch {
            return null; // The default theme applies without storage.
          }
        })();
        const read = (key) => {
          try {
            return storage?.getItem(key) ?? null;
          } catch {
            return null;
          }
        };
        // Keep in sync with each theme's `--background` in ui-kit theme.css.
        const backgrounds = {
          "nerve-light": "#f6f3eb",
          "nerve-dark": "#272521",
          "melange-light": "#f4f0ed",
          "melange-dark": "#292522",
          graphite: "#1d1a18",
        };
        const light = ["nerve-light", "melange-light"];
        const valid = (theme) => Object.hasOwn(backgrounds, theme);
        const migrate = () => {
          const graphitePair = ["nerve-light", "graphite"];
          const nervePair = ["nerve-light", "nerve-dark"];
          const pair = {
            nerve: nervePair,
            rose: nervePair,
            forest: nervePair,
            slate: nervePair,
            solar: graphitePair,
            ocean: graphitePair,
            midnight: graphitePair,
          }[read("nerve-color-theme")];
          const stored = (dark) => {
            const theme =
              read(dark ? "nerve-dark-theme" : "nerve-light-theme") ??
              pair?.[dark ? 1 : 0];
            return valid(theme) && light.includes(theme) !== dark
              ? theme
              : null;
          };
          const slot = (dark) =>
            stored(dark) ?? (dark ? "nerve-dark" : "nerve-light");
          const mode = read("mode-watcher-mode");
          if (mode === "light" || mode === "dark") return slot(mode === "dark");
          if (!stored(false) && !stored(true)) return "nerve-dark";
          return slot(
            window.matchMedia("(prefers-color-scheme: dark)").matches,
          );
        };
        const saved = read("nerve-theme");
        let theme = saved ?? migrate();
        if (!valid(theme)) theme = "nerve-dark";
        if (saved === null && storage) {
          try {
            storage.setItem("nerve-theme", theme);
            for (const key of [
              "nerve-light-theme",
              "nerve-dark-theme",
              "nerve-color-theme",
              "mode-watcher-mode",
              "mode-watcher-theme",
            ])
              storage.removeItem(key);
          } catch {
            // The app retries the migration on load.
          }
        }
        const kind = light.includes(theme) ? "light" : "dark";
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", kind === "dark");
        root.style.colorScheme = kind;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", backgrounds[theme]);
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Nerve" />
    <!-- Pre-stylesheet startup splash. The block between the
         `startup-splash` markers (styles and markup) mirrors
         packages/desktop-shell/src/window/startup-splash-document.ts verbatim so
         the Electron shell page and this document render identical pixels;
         scripts/checks/test/startup-splash-sync.test.mjs fails on any drift. Only the
         --splash-* declarations below are host-specific. -->
    <style>
      :root {
        color-scheme: light dark;
        --splash-bg: oklch(0.965 0.012 92);
        --splash-fg: oklch(0.3438 0.0269 95.7);
        --splash-primary: oklch(0.57 0.1375 39);
        --splash-muted: oklch(0.4867 0.02347 95.27);
        --splash-border: oklch(0.8594 0.01453 93.16);
        --splash-font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: oklch(0.264 0.018 80);
          --splash-fg: oklch(0.9 0.012 95);
          --splash-primary: oklch(0.6724 0.1308 38.8);
          --splash-muted: oklch(0.7919 0.01294 91.49);
          --splash-border: oklch(0.3848 0.01679 82.01);
        }
      }
      /* The bootstrap script always sets data-theme, so each theme pins its
         own palette regardless of the system preference. */
      :root[data-theme="nerve-light"] {
        --splash-bg: oklch(0.965 0.012 92);
        --splash-fg: oklch(0.3438 0.0269 95.7);
        --splash-primary: oklch(0.57 0.1375 39);
        --splash-muted: oklch(0.4867 0.02347 95.27);
        --splash-border: oklch(0.8594 0.01453 93.16);
      }
      :root[data-theme="nerve-dark"] {
        --splash-bg: oklch(0.264 0.018 80);
        --splash-fg: oklch(0.9 0.012 95);
        --splash-primary: oklch(0.6724 0.1308 38.8);
        --splash-muted: oklch(0.7919 0.01294 91.49);
        --splash-border: oklch(0.3848 0.01679 82.01);
      }
      :root[data-theme="graphite"] {
        --splash-bg: oklch(0.22 0.006 65);
        --splash-fg: oklch(0.91 0.006 80);
        --splash-primary: oklch(0.7 0.15 40);
        --splash-muted: oklch(0.7858 0.00597 77.32);
        --splash-border: oklch(0.3511 0.005968 67.83);
      }
      :root[data-theme="melange-light"] {
        --splash-bg: oklch(0.958 0.006 70);
        --splash-fg: oklch(0.398 0.028 49.4);
        --splash-primary: oklch(0.55 0.145 52.6);
        --splash-muted: oklch(0.4596 0.02554 49.92);
        --splash-border: oklch(0.818 0.01132 57.44);
      }
      :root[data-theme="melange-dark"] {
        --splash-bg: oklch(0.268 0.008 59.3);
        --splash-fg: oklch(0.916 0.018 64.9);
        --splash-primary: oklch(0.749 0.117 59.9);
        --splash-muted: oklch(0.8382 0.0168 64.58);
        --splash-border: oklch(0.417 0.01029 61.55);
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-fg);
      }
      /* Declaring a region makes Electron replace the drag regions left by the
         previous page (the desktop shell's all-drag loading page), so no state
         without a titlebar inherits a window-wide drag handle. */
      html {
        -webkit-app-region: no-drag;
      }

      /* startup-splash:begin */
      #startup-splash,
      #startup-splash *,
      #startup-splash *::before {
        box-sizing: border-box;
      }
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        color: var(--splash-fg);
        font-family: var(--splash-font-sans);
        /* Frameless desktop window: the backdrop moves it while no titlebar
           exists; ignored outside Electron. */
        -webkit-app-region: drag;
        transition:
          opacity 280ms ease,
          transform 280ms ease,
          filter 280ms ease;
      }
      /* Hidden while a startup failure is shown; a retry shows it again. */
      #startup-splash.is-hidden {
        display: none;
      }
      #startup-splash.is-dismissed {
        opacity: 0;
        transform: scale(1.03);
        filter: blur(4px);
        pointer-events: none;
        /* Drag regions ignore pointer-events; release the window during the
           fade so the revealed workbench is clickable at once. */
        -webkit-app-region: no-drag;
      }
      #startup-splash-content {
        -webkit-app-region: no-drag;
        transform: scale(var(--nerve-inverse-zoom-scale, 1));
        transform-origin: center;
      }
      #startup-splash-stage {
        display: grid;
        justify-items: center;
        padding: 1.5rem;
        text-align: center;
        animation: splash-push 2400ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: var(--splash-t0, 0ms);
      }
      #startup-splash-plate {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        width: 3rem;
        height: 3rem;
        border-radius: 0.625rem;
        color: var(--splash-bg);
        animation: splash-beat 2400ms cubic-bezier(0.22, 1, 0.36, 1) infinite
          both;
        animation-delay: calc(var(--splash-t0, 0ms) + 2200ms);
      }
      #startup-splash-plate::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: var(--splash-fg);
        animation: splash-plate 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--splash-t0, 0ms) + 900ms);
      }
      #startup-splash-mark {
        position: relative;
        z-index: 1;
        width: 62.5%;
        height: 62.5%;
        color: var(--splash-bg);
        animation: splash-ink 420ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 1050ms);
      }
      #startup-splash-mark path {
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
        animation: splash-draw 860ms cubic-bezier(0.65, 0, 0.35, 1) both;
      }
      #startup-splash-mark .splash-stem-left {
        animation-delay: calc(var(--splash-t0, 0ms) + 60ms);
      }
      #startup-splash-mark .splash-stem-right {
        animation-delay: calc(var(--splash-t0, 0ms) + 140ms);
      }
      #startup-splash-mark .splash-diagonal {
        animation-duration: 900ms;
        animation-delay: calc(var(--splash-t0, 0ms) + 240ms);
      }
      /* After the intro an impulse keeps travelling through the letterform, so long
      waits (storage upgrades) never look frozen. Each lap ends in a plate beat. */
      #startup-splash-mark path.splash-pulse {
        stroke: var(--splash-primary);
        stroke-dasharray: 16 116;
        stroke-dashoffset: 16;
        animation: splash-pulse 2400ms cubic-bezier(0.45, 0, 0.25, 1) infinite
          both;
        animation-delay: calc(var(--splash-t0, 0ms) + 2200ms);
      }
      #startup-splash-sheen {
        position: absolute;
        z-index: 2;
        top: -60%;
        bottom: -60%;
        left: -40%;
        width: 34%;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in oklab, var(--splash-bg) 65%, transparent),
          transparent
        );
        transform: rotate(18deg) translateX(460%);
        animation: splash-sheen 700ms cubic-bezier(0.4, 0, 0.2, 1) both;
        animation-delay: calc(var(--splash-t0, 0ms) + 1350ms);
      }
      #startup-splash-word {
        margin-top: 0.875rem;
        font-size: 1.0625rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      #startup-splash-word span {
        display: inline-block;
        animation: splash-rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #startup-splash-word span:nth-child(1) {
        animation-delay: calc(var(--splash-t0, 0ms) + 1150ms);
      }
      #startup-splash-word span:nth-child(2) {
        animation-delay: calc(var(--splash-t0, 0ms) + 1195ms);
      }
      #startup-splash-word span:nth-child(3) {
        animation-delay: calc(var(--splash-t0, 0ms) + 1240ms);
      }
      #startup-splash-word span:nth-child(4) {
        animation-delay: calc(var(--splash-t0, 0ms) + 1285ms);
      }
      #startup-splash-word span:nth-child(5) {
        animation-delay: calc(var(--splash-t0, 0ms) + 1330ms);
      }
      #startup-splash-status {
        width: min(21rem, calc(100vw - 3rem));
        margin: 1.25rem 0 0;
        overflow: hidden;
        color: var(--splash-muted);
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        text-overflow: ellipsis;
        animation: splash-fade 420ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 300ms);
      }
      /* Each status change re-adds this class so the copy swaps with a short lift
      instead of snapping between sentences. */
      #startup-splash-status.is-swapping {
        animation: splash-status-swap 200ms ease-out both;
      }
      #startup-splash-detail {
        margin: 0.375rem 0 0;
        color: var(--splash-muted);
        font-size: 0.75rem;
        line-height: 1.25rem;
      }
      #startup-splash [hidden] {
        display: none;
      }
      #startup-splash-meter {
        width: min(21rem, calc(100vw - 3rem));
        height: 0.25rem;
        margin-top: 0.5rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--splash-border);
        animation: splash-fade 420ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 300ms);
      }
      #startup-splash-fill {
        position: relative;
        display: block;
        overflow: hidden;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-primary);
        transform: scaleX(0.92);
        transform-origin: left center;
        transition: transform 180ms ease-out;
        animation: splash-meter 2600ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--splash-t0, 0ms) + 300ms);
      }
      #startup-splash-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in oklab, var(--splash-primary) 45%, white),
          transparent
        );
        transform: translateX(-100%);
        animation: splash-shimmer 1800ms ease-in-out infinite;
        animation-delay: calc(var(--splash-t0, 0ms) + 1200ms);
      }
      #startup-splash.is-complete #startup-splash-fill {
        transform: scaleX(1);
        animation: none;
      }
      @keyframes splash-push {
        from {
          transform: scale(1.035);
        }
      }
      @keyframes splash-plate {
        from {
          opacity: 0;
          clip-path: inset(0 0 100% 0 round 0.625rem);
        }
      }
      @keyframes splash-draw {
        from {
          stroke-dashoffset: 100;
        }
      }
      @keyframes splash-ink {
        from {
          color: var(--splash-fg);
        }
      }
      @keyframes splash-sheen {
        from {
          transform: rotate(18deg) translateX(-260%);
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(0.5rem);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-status-swap {
        from {
          opacity: 0;
          transform: translateY(0.25rem);
        }
      }
      @keyframes splash-meter {
        from {
          transform: scaleX(0.04);
        }
      }
      @keyframes splash-pulse {
        0% {
          stroke-dashoffset: 16;
        }
        55%,
        100% {
          stroke-dashoffset: -100;
        }
      }
      @keyframes splash-beat {
        0%,
        52% {
          transform: scale(1);
          box-shadow: 0 0 0 0
            color-mix(in oklab, var(--splash-primary) 55%, transparent);
        }
        60% {
          transform: scale(1.06);
        }
        80% {
          transform: scale(1);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 1.25rem
            color-mix(in oklab, var(--splash-primary) 0%, transparent);
        }
      }
      @keyframes splash-shimmer {
        to {
          transform: translateX(250%);
        }
      }
      /* The settled composition is the base state, so suppressing the intro is enough
      for reduced motion and for the desktop hand-off after the shell already
      played it. Ambient .splash-loop motion keeps running while settled. */
      :root[data-splash-intro="settled"] #startup-splash *:not(.splash-loop),
      :root[data-splash-intro="settled"] #startup-splash *::before {
        animation: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-splash {
          transition-duration: 1ms;
        }
        #startup-splash *,
        #startup-splash *::before,
        #startup-splash *::after {
          animation: none !important;
        }
        #startup-splash-fill::after {
          display: none;
        }
      }
      /* startup-splash:end */
    </style>
    <title>nerve</title>
  </head>
  <body>
    <div id="app">
      <!-- startup-splash:begin -->
      <div id="startup-splash" aria-busy="true" aria-label="Starting Nerve">
        <div id="startup-splash-content">
          <div id="startup-splash-stage">
            <div
              id="startup-splash-plate"
              class="splash-loop"
              aria-hidden="true"
            >
              <svg
                id="startup-splash-mark"
                viewBox="120 120 272 272"
                fill="none"
                focusable="false"
              >
                <g
                  stroke="currentColor"
                  stroke-width="32"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    class="splash-stem-left"
                    pathLength="100"
                    d="M150 350V162"
                  />
                  <path
                    class="splash-stem-right"
                    pathLength="100"
                    d="M362 350V162"
                  />
                  <path
                    class="splash-diagonal"
                    pathLength="100"
                    d="M150 162L232 235L258 208L284 288L362 350"
                  />
                  <path
                    class="splash-pulse splash-loop"
                    pathLength="100"
                    d="M150 350V162L232 235L258 208L284 288L362 350V162"
                  />
                </g>
              </svg>
              <span id="startup-splash-sheen"></span>
            </div>
            <div id="startup-splash-word" aria-hidden="true">
              <span>n</span><span>e</span><span>r</span><span>v</span
              ><span>e</span>
            </div>
            <p id="startup-splash-status" aria-live="polite">Opening Nerve</p>
            <p id="startup-splash-detail" hidden aria-live="polite"></p>
            <div
              id="startup-splash-meter"
              role="progressbar"
              aria-label="Starting Nerve"
            >
              <span id="startup-splash-fill"></span>
            </div>
          </div>
        </div>
      </div>
      <!-- startup-splash:end -->
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
