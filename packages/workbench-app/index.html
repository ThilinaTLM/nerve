<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Before the theme bootstrap, which sets it to the theme's background. -->
    <meta name="theme-color" content="#272521" />
    <script>
      // Consumes the desktop shell hand-off parameters before anything paints:
      // the saved zoom level, and how far the shell already played the startup
      // intro so this document resumes that timeline instead of restarting it.
      (() => {
        const url = new URL(window.location.href);
        const consume = (parameter) => {
          const value = url.searchParams.get(parameter);
          if (value !== null) url.searchParams.delete(parameter);
          return value;
        };
        const rawLevel = consume("nerveInitialZoomLevel");
        const rawElapsed = consume("nerveSplashElapsedMs");
        if (rawLevel === null && rawElapsed === null) return;
        window.history.replaceState(
          {},
          "",
          `${url.pathname}${url.search}${url.hash}`,
        );

        const parsedLevel = Number(rawLevel);
        if (rawLevel !== null && Number.isInteger(parsedLevel)) {
          const level = Math.min(8, Math.max(-8, parsedLevel));
          const scale = 1.1 ** level;
          document.documentElement.style.setProperty(
            "--nerve-zoom-scale",
            scale.toFixed(4),
          );
          document.documentElement.style.setProperty(
            "--nerve-inverse-zoom-scale",
            (1 / scale).toFixed(4),
          );
          try {
            window.sessionStorage.setItem(
              "nerve.initialZoomLevel",
              String(level),
            );
          } catch {
            // The CSS variable is already applied; storage is only for app state.
          }
        }

        const parsedElapsed = Number(rawElapsed);
        if (rawElapsed !== null && Number.isFinite(parsedElapsed)) {
          const elapsed = Math.min(
            10000,
            Math.max(0, Math.round(parsedElapsed)),
          );
          document.documentElement.style.setProperty(
            "--splash-t0",
            `-${elapsed}ms`,
          );
        }
      })();
    </script>
    <script>
      // Applies the stored theme before the stylesheet loads so the startup
      // splash matches the workspace. Mirrors `migrateStoredTheme` in
      // src/lib/platform/appearance/theme-preference.ts, including the one-time
      // migration from the light/dark/colour-mode keys.
      (() => {
        const storage = (() => {
          try {
            return window.localStorage;
          } catch {
            return null; // The default theme applies without storage.
          }
        })();
        const read = (key) => {
          try {
            return storage?.getItem(key) ?? null;
          } catch {
            return null;
          }
        };
        // Keep in sync with each theme's `--background` in ui-kit theme.css.
        const backgrounds = {
          "nerve-light": "#f6f3eb",
          "nerve-dark": "#272521",
          "melange-light": "#f4f0ed",
          "melange-dark": "#292522",
          graphite: "#1d1a18",
          indigo: "#262541",
        };
        const light = ["nerve-light", "melange-light"];
        const valid = (theme) => Object.hasOwn(backgrounds, theme);
        const migrate = () => {
          const graphitePair = ["nerve-light", "graphite"];
          const nervePair = ["nerve-light", "nerve-dark"];
          const pair = {
            nerve: nervePair,
            rose: nervePair,
            forest: nervePair,
            slate: nervePair,
            solar: graphitePair,
            ocean: graphitePair,
            midnight: graphitePair,
          }[read("nerve-color-theme")];
          const stored = (dark) => {
            const theme =
              read(dark ? "nerve-dark-theme" : "nerve-light-theme") ??
              pair?.[dark ? 1 : 0];
            return valid(theme) && light.includes(theme) !== dark
              ? theme
              : null;
          };
          const slot = (dark) =>
            stored(dark) ?? (dark ? "nerve-dark" : "nerve-light");
          const mode = read("mode-watcher-mode");
          if (mode === "light" || mode === "dark") return slot(mode === "dark");
          if (!stored(false) && !stored(true)) return "nerve-dark";
          return slot(
            window.matchMedia("(prefers-color-scheme: dark)").matches,
          );
        };
        const saved = read("nerve-theme");
        let theme = saved ?? migrate();
        if (!valid(theme)) theme = "nerve-dark";
        if (saved === null && storage) {
          try {
            storage.setItem("nerve-theme", theme);
            for (const key of [
              "nerve-light-theme",
              "nerve-dark-theme",
              "nerve-color-theme",
              "mode-watcher-mode",
              "mode-watcher-theme",
            ])
              storage.removeItem(key);
          } catch {
            // The app retries the migration on load.
          }
        }
        const kind = light.includes(theme) ? "light" : "dark";
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", kind === "dark");
        root.style.colorScheme = kind;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", backgrounds[theme]);
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Nerve" />
    <!-- Pre-stylesheet startup splash. The block between the
         `startup-splash` markers (styles and markup) mirrors
         packages/desktop-shell/src/window/startup-splash-document.ts verbatim so
         the Electron shell page and this document render identical pixels;
         scripts/checks/test/startup-splash-sync.test.ts fails on any drift. Only the
         --splash-* declarations below are host-specific; %NERVE_VERSION% is
         replaced with the release version by vite.config.ts. -->
    <style>
      :root {
        color-scheme: light dark;
        --splash-bg: oklch(0.965 0.012 92);
        --splash-fg: oklch(0.3438 0.0269 95.7);
        --splash-primary: oklch(0.57 0.1375 39);
        --splash-muted: oklch(0.4867 0.02347 95.27);
        --splash-border: oklch(0.8594 0.01453 93.16);
        --splash-font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: oklch(0.264 0.018 80);
          --splash-fg: oklch(0.9 0.012 95);
          --splash-primary: oklch(0.6724 0.1308 38.8);
          --splash-muted: oklch(0.7919 0.01294 91.49);
          --splash-border: oklch(0.3848 0.01679 82.01);
        }
      }
      /* The bootstrap script always sets data-theme, so each theme pins its
         own palette regardless of the system preference. */
      :root[data-theme="nerve-light"] {
        --splash-bg: oklch(0.965 0.012 92);
        --splash-fg: oklch(0.3438 0.0269 95.7);
        --splash-primary: oklch(0.57 0.1375 39);
        --splash-muted: oklch(0.4867 0.02347 95.27);
        --splash-border: oklch(0.8594 0.01453 93.16);
      }
      :root[data-theme="nerve-dark"] {
        --splash-bg: oklch(0.264 0.018 80);
        --splash-fg: oklch(0.9 0.012 95);
        --splash-primary: oklch(0.6724 0.1308 38.8);
        --splash-muted: oklch(0.7919 0.01294 91.49);
        --splash-border: oklch(0.3848 0.01679 82.01);
      }
      :root[data-theme="graphite"] {
        --splash-bg: oklch(0.22 0.006 65);
        --splash-fg: oklch(0.91 0.006 80);
        --splash-primary: oklch(0.7 0.15 40);
        --splash-muted: oklch(0.7858 0.00597 77.32);
        --splash-border: oklch(0.3511 0.005968 67.83);
      }
      :root[data-theme="indigo"] {
        --splash-bg: oklch(0.28 0.05 283.5);
        --splash-fg: oklch(0.946 0.026 251.7);
        --splash-primary: oklch(0.868 0.178 94.1);
        --splash-muted: oklch(0.8794 0.02777 257.14);
        --splash-border: oklch(0.4065 0.04477 280.17);
      }
      :root[data-theme="melange-light"] {
        --splash-bg: oklch(0.958 0.006 70);
        --splash-fg: oklch(0.398 0.028 49.4);
        --splash-primary: oklch(0.55 0.145 52.6);
        --splash-muted: oklch(0.4596 0.02554 49.92);
        --splash-border: oklch(0.818 0.01132 57.44);
      }
      :root[data-theme="melange-dark"] {
        --splash-bg: oklch(0.268 0.008 59.3);
        --splash-fg: oklch(0.916 0.018 64.9);
        --splash-primary: oklch(0.749 0.117 59.9);
        --splash-muted: oklch(0.8382 0.0168 64.58);
        --splash-border: oklch(0.417 0.01029 61.55);
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-fg);
      }
      /* Declaring a region makes Electron replace the drag regions left by the
         previous page (the desktop shell's all-drag loading page), so no state
         without a titlebar inherits a window-wide drag handle.
         The region is inherited, so it is reset on body: otherwise every box
         becomes a no-drag region, and Chromium does not clip those to their
         scroll container, so rows scrolled out of a long transcript block
         dragging the titlebar. Elements set their own region explicitly;
         portaled layers (dialogs, sheets, popovers) stay clickable where they
         overlap the titlebar. */
      html {
        -webkit-app-region: no-drag;
      }
      body {
        -webkit-app-region: initial;
      }
      body > :where(:not(#app)) {
        -webkit-app-region: no-drag;
      }

      /* startup-splash:begin */
      #startup-splash,
      #startup-splash *,
      #startup-splash *::before {
        box-sizing: border-box;
      }
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        color: var(--splash-fg);
        font-family: var(--splash-font-sans);
        /* Frameless desktop window: the backdrop moves it while no titlebar
      exists; ignored outside Electron. */
        -webkit-app-region: drag;
      }
      /* Hidden while a startup failure is shown; a retry shows it again. */
      #startup-splash.is-hidden {
        display: none;
      }
      #startup-splash.is-dismissed {
        pointer-events: none;
        /* Drag regions ignore pointer-events; release the window during the
      exit so the revealed workbench is clickable at once. */
        -webkit-app-region: no-drag;
        animation: splash-backdrop-out 300ms ease-in 240ms both;
      }
      #startup-splash [hidden] {
        display: none;
      }
      #startup-splash-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--splash-border) 1px, transparent 1px),
          linear-gradient(90deg, var(--splash-border) 1px, transparent 1px);
        background-position: center;
        background-size: 1.5rem 1.5rem;
        -webkit-mask-image: radial-gradient(
          circle at center,
          black,
          transparent 60%
        );
        mask-image: radial-gradient(circle at center, black, transparent 60%);
        opacity: 0.55;
        animation: splash-fade 700ms ease-out both;
        animation-delay: var(--splash-t0, 0ms);
      }
      #startup-splash-content {
        position: relative;
        -webkit-app-region: no-drag;
        transform: scale(var(--nerve-inverse-zoom-scale, 1));
        transform-origin: center;
      }
      #startup-splash-stage {
        display: grid;
        justify-items: center;
        padding: 1.5rem;
        text-align: center;
        animation: splash-push 2400ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: var(--splash-t0, 0ms);
      }
      #startup-splash-plate {
        position: relative;
        width: 3.25rem;
        height: 3.25rem;
        animation: splash-impact 460ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 540ms);
      }
      #startup-splash-plate-fill,
      #startup-splash .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 0.375rem;
      }
      #startup-splash-plate-fill {
        background: var(--splash-fg);
        animation:
          splash-plate 620ms cubic-bezier(0.34, 1.56, 0.64, 1) both,
          splash-thump 2800ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
        animation-delay:
          calc(var(--splash-t0, 0ms) + 520ms),
          calc(var(--splash-t0, 0ms) + 2000ms);
      }
      #startup-splash .splash-ring {
        border: 2px solid var(--splash-primary);
        opacity: 0;
      }
      #startup-splash .splash-ring-intro {
        animation: splash-ring 760ms cubic-bezier(0.16, 1, 0.3, 1);
        animation-delay: calc(var(--splash-t0, 0ms) + 540ms);
      }
      /* Long waits (storage upgrades) keep a beat so the splash never looks frozen. */
      #startup-splash .splash-ring-idle {
        animation: splash-ring-idle 2800ms cubic-bezier(0.16, 1, 0.3, 1)
          infinite;
        animation-delay: calc(var(--splash-t0, 0ms) + 2000ms);
      }
      #startup-splash-mark {
        position: absolute;
        inset: 18.75%;
        width: 62.5%;
        height: 62.5%;
        overflow: visible;
        color: var(--splash-bg);
        animation: splash-ink 180ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 520ms);
      }
      /* Bands alternate sides; --band-i staggers the entry and exit, --band-g
      sizes each band's glitch offset. */
      #startup-splash .splash-band {
        --band-x: -320px;
        --band-i: 0;
        --band-g: 10px;
        animation: splash-band-in 760ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(var(--splash-t0, 0ms) + var(--band-i) * 55ms);
      }
      #startup-splash .splash-band:nth-child(2) {
        --band-x: 320px;
        --band-i: 1;
        --band-g: -14px;
      }
      #startup-splash .splash-band:nth-child(3) {
        --band-i: 2;
        --band-g: 6px;
      }
      #startup-splash .splash-band:nth-child(4) {
        --band-x: 320px;
        --band-i: 3;
        --band-g: -8px;
      }
      #startup-splash .splash-band:nth-child(5) {
        --band-i: 4;
        --band-g: 16px;
      }
      #startup-splash .splash-band:nth-child(6) {
        --band-x: 320px;
        --band-i: 5;
        --band-g: -6px;
      }
      #startup-splash .splash-band-glitch {
        animation: splash-glitch 3200ms steps(1, end) infinite;
        animation-delay: calc(var(--splash-t0, 0ms) + 1600ms);
      }
      #startup-splash .splash-band-ghost {
        stroke: var(--splash-primary);
        opacity: 0;
        animation: splash-ghost 3200ms steps(1, end) infinite;
        animation-delay: calc(var(--splash-t0, 0ms) + 1600ms);
      }
      #startup-splash-word {
        margin-top: 0.875rem;
        font-size: 1.0625rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      #startup-splash-word span {
        --letter-x: -0.75rem;
        --letter-i: 0;
        display: inline-block;
        animation: splash-letter 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: calc(
          var(--splash-t0, 0ms) + 560ms + var(--letter-i) * 45ms
        );
      }
      #startup-splash-word span:nth-child(2) {
        --letter-x: 0.75rem;
        --letter-i: 1;
      }
      #startup-splash-word span:nth-child(3) {
        --letter-i: 2;
      }
      #startup-splash-word span:nth-child(4) {
        --letter-x: 0.75rem;
        --letter-i: 3;
      }
      #startup-splash-word span:nth-child(5) {
        --letter-i: 4;
      }
      #startup-splash-status {
        width: min(21rem, calc(100vw - 3rem));
        margin: 1.125rem 0 0;
        overflow: hidden;
        color: var(--splash-muted);
        font-size: 0.875rem;
        line-height: 1.25rem;
        white-space: nowrap;
        text-overflow: ellipsis;
        animation: splash-fade 420ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 300ms);
      }
      /* Each status change re-adds this class so the copy swaps with a short lift
      instead of snapping between sentences. */
      #startup-splash-status.is-swapping {
        animation: splash-status-swap 200ms ease-out both;
      }
      #startup-splash-detail {
        margin: 0;
        color: var(--splash-muted);
        font-size: 0.75rem;
        line-height: 1.25rem;
      }
      #startup-splash-meter {
        width: min(12rem, calc(100vw - 3rem));
        height: 0.125rem;
        margin-top: 0.375rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--splash-border);
        animation: splash-fade 420ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 300ms);
      }
      #startup-splash-fill {
        position: relative;
        display: block;
        overflow: hidden;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: var(--splash-primary);
        transform: scaleX(0.92);
        transform-origin: left center;
        transition: transform 180ms ease-out;
        animation: splash-meter 2600ms cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--splash-t0, 0ms) + 300ms);
      }
      #startup-splash-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in oklab, var(--splash-primary) 45%, white),
          transparent
        );
        transform: translateX(-100%);
        animation: splash-shimmer 1800ms ease-in-out infinite;
        animation-delay: calc(var(--splash-t0, 0ms) + 1200ms);
      }
      #startup-splash.is-complete #startup-splash-fill {
        transform: scaleX(1);
        animation: none;
      }
      #startup-splash-version {
        position: absolute;
        bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
        left: 50%;
        margin: 0;
        color: var(--splash-muted);
        font-size: 0.75rem;
        line-height: 1rem;
        letter-spacing: 0.04em;
        white-space: nowrap;
        opacity: 0.7;
        transform: translateX(-50%) scale(var(--nerve-inverse-zoom-scale, 1));
        transform-origin: center bottom;
        animation: splash-fade 600ms ease-out both;
        animation-delay: calc(var(--splash-t0, 0ms) + 900ms);
      }
      /* Exit. Copy leaves first, the plate drops out so the bands leave in full
      colour, then the bands slide back out while the backdrop clears. */
      #startup-splash.is-dismissed #startup-splash-word,
      #startup-splash.is-dismissed #startup-splash-status,
      #startup-splash.is-dismissed #startup-splash-detail,
      #startup-splash.is-dismissed #startup-splash-meter {
        animation: splash-text-out 240ms cubic-bezier(0.5, 0, 0.75, 0) both;
      }
      #startup-splash.is-dismissed #startup-splash-grid,
      #startup-splash.is-dismissed #startup-splash-version {
        animation: splash-out 240ms ease-in both;
      }
      #startup-splash.is-dismissed #startup-splash-plate,
      #startup-splash.is-dismissed .splash-ring,
      #startup-splash.is-dismissed .splash-band-glitch,
      #startup-splash.is-dismissed .splash-band-ghost {
        animation: none;
      }
      #startup-splash.is-dismissed #startup-splash-plate-fill {
        animation: splash-out 140ms ease-in both;
      }
      #startup-splash.is-dismissed #startup-splash-mark {
        animation: splash-ink-out 120ms ease-in both;
      }
      #startup-splash.is-dismissed .splash-band {
        animation: splash-band-out 360ms cubic-bezier(0.7, 0, 0.84, 0) both;
        animation-delay: calc(80ms + var(--band-i) * 30ms);
      }
      @keyframes splash-push {
        from {
          transform: scale(1.035);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
        }
      }
      @keyframes splash-backdrop-out {
        to {
          background-color: transparent;
        }
      }
      @keyframes splash-band-in {
        from {
          opacity: 0;
          transform: translateX(var(--band-x));
        }
        40% {
          opacity: 1;
        }
      }
      @keyframes splash-band-out {
        60% {
          opacity: 1;
        }
        to {
          opacity: 0;
          transform: translateX(var(--band-x));
        }
      }
      @keyframes splash-plate {
        from {
          opacity: 0;
          transform: scale(0.3);
        }
      }
      @keyframes splash-impact {
        25% {
          transform: scale(1.1, 0.9);
        }
        55% {
          transform: scale(0.96, 1.04);
        }
      }
      @keyframes splash-ring {
        from {
          opacity: 0.9;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(2.4);
        }
      }
      @keyframes splash-ring-idle {
        0% {
          opacity: 0.6;
          transform: scale(1);
        }
        45%,
        100% {
          opacity: 0;
          transform: scale(1.9);
        }
      }
      @keyframes splash-thump {
        8% {
          transform: scale(1.06);
        }
        30%,
        100% {
          transform: scale(1);
        }
      }
      @keyframes splash-ink {
        from {
          color: var(--splash-fg);
        }
      }
      @keyframes splash-ink-out {
        from {
          color: var(--splash-bg);
        }
        to {
          color: var(--splash-fg);
        }
      }
      @keyframes splash-glitch {
        0%,
        86% {
          transform: translateX(0);
        }
        88% {
          transform: translateX(var(--band-g));
        }
        90% {
          transform: translateX(calc(var(--band-g) * -0.6));
        }
        92%,
        100% {
          transform: translateX(0);
        }
      }
      @keyframes splash-ghost {
        0%,
        86% {
          opacity: 0;
          transform: translateX(0);
        }
        88% {
          opacity: 0.9;
          transform: translateX(-8px);
        }
        90% {
          opacity: 0.9;
          transform: translateX(8px);
        }
        92%,
        100% {
          opacity: 0;
