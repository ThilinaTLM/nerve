name: Publish Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release dry run' || 'Publish release' }} (${{ github.ref_name }})

on:
  # Manual runs always validate only; publishing requires a pushed release tag.
  workflow_dispatch:
  push:
    tags:
      # Stable releases: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases: v1.2.3-rc.1, v1.2.3-beta.2, etc.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest

    steps:
      - name: Require a release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Derive dry-run tag from package version
        if: github.event_name == 'workflow_dispatch'
        run: echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Verify release tag
        run: node scripts/release/verify-release-tag.ts "${RELEASE_TAG}"

  # The release commit is pushed to main together with its tag, so CI validates
  # the same commit in full (checks, all package tests, browser, website and
  # Windows/macOS native suites). Wait for that run instead of repeating it here;
  # this workflow keeps only release-specific builds, smokes and packaging.
  require-ci:
    name: Require passing CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - name: Wait for CI on the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Tags need the full-coverage main push run; dry runs of a candidate
          # branch also accept its pull request run.
          EVENTS: ${{ github.event_name == 'push' && '["push"]' || '["push","pull_request"]' }}
        run: |
          set -euo pipefail
          # CI starts within seconds of the push; allow a grace period before
          # treating a missing run as "never ran".
          grace=$((SECONDS + 300))
          while :; do
            runs="$(gh run list --workflow ci.yml --commit "${SHA}" --limit 50 \
              --json databaseId,event,status,conclusion,url \
              | jq --argjson events "${EVENTS}" '[.[] | select(.event as $e | $events | index($e))]')"
            success="$(jq -r '[.[] | select(.conclusion == "success")][0].url // empty' <<<"${runs}")"
            if [ -n "${success}" ]; then
              echo "CI passed for ${SHA}: ${success}"
              exit 0
            fi
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")"
            total="$(jq 'length' <<<"${runs}")"
            if [ "${pending}" -eq 0 ] && [ "${total}" -gt 0 ]; then
              jq -r '.[] | "\(.event) \(.conclusion) \(.url)"' <<<"${runs}" >&2
              echo "CI did not pass for ${SHA}; re-run CI, then re-run this workflow" >&2
              exit 1
            fi
            if [ "${total}" -eq 0 ] && [ "${SECONDS}" -gt "${grace}" ]; then
              echo "No CI run (${EVENTS}) found for ${SHA}; release commits must be on main (dry runs: open a pull request)" >&2
              exit 1
            fi
            echo "Waiting for CI on ${SHA} (${pending} run(s) in progress)"
            sleep 30
          done

  native-prebuilds:
    name: Native prebuild (${{ matrix.target }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            node_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.10
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify runner architecture
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Expected ' + process.env.EXPECTED_NODE_ARCH + ', got ' + process.arch)"
      - name: Build native prebuild
        working-directory: packages/native
        run: pnpm exec napi build --cwd native --package-json-path ../package.json --platform --release --target ${{ matrix.target }} --output-dir ../prebuilds
      - name: Test native prebuild
        # A hung test must fail this step, not hit the job timeout: a
        # job-timeout cancellation discards the log that names the test.
        timeout-minutes: 12
        run: pnpm --filter @nervekit/native test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-prebuild-${{ matrix.target }}
          path: packages/native/prebuilds/*.node
          if-no-files-found: error

  build-and-package:
    name: Build, smoke, and package (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - native-prebuilds
    timeout-minutes: 30

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.10
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-prebuild-*
          path: packages/native/prebuilds
          merge-multiple: true

      - name: Verify native prebuild inventory
        run: node scripts/release/verify-native-prebuilds.ts

      - name: Build all packages
        run: pnpm build

      - name: Smoke built workbench HTTP and WebSocket parity
        run: node scripts/release/smoke-workbench-release.ts

      - name: Smoke desktop resolution and CLI
        run: node scripts/release/smoke-desktop-release.ts

      - name: Smoke generated desktop assets
        run: node scripts/release/smoke-desktop-package.ts

      - name: Pack and verify npm tarballs
        run: node scripts/release/pack-npm.ts

      - name: Upload verified npm tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  native-package-smoke:
    name: npm package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - verify-tag
      - native-prebuilds
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.10
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-prebuild-*
          path: packages/native/prebuilds
          merge-multiple: true

      - name: Verify native prebuild inventory
        run: node scripts/release/verify-native-prebuilds.ts

      - name: Build all packages
        run: pnpm build

      - name: Smoke generated desktop assets
        run: node scripts/release/smoke-desktop-package.ts

      - name: Pack and verify npm tarballs
        run: node scripts/release/pack-npm.ts

      - name: Verify built desktop runtime
        run: node scripts/release/smoke-desktop-release.ts

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - require-ci
      - build-and-package
      - native-package-smoke
    permissions:
      contents: read

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.28.10
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @nervekit/website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/website/dist

  publish-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - require-ci
      - build-and-package
      - native-package-smoke
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Node 24 and npm >= 11.5.1
        shell: bash
        run: |
          node_version="$(node --version)"
          echo "node: ${node_version}"
          case "${node_version}" in
            v24.*) ;;
            *) echo "Expected Node 24, got ${node_version}" >&2; exit 1 ;;
          esac
          npm_version="$(npm --version)"
          echo "npm: ${npm_version}"
          # Trusted publishing (OIDC) requires npm >= 11.5.1.
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm to satisfy trusted publishing (>= 11.5.1)"
            npm install -g npm@latest
            echo "npm: $(npm --version)"
          fi

      - name: Download verified npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release/npm

      - name: Publish npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            dist_tag="next"
          fi
          # Platform packages first: @nervekit/desktop pins them as optionalDependencies.
          tarballs=()
          for triple in linux-x64-gnu linux-arm64-gnu darwin-x64 darwin-arm64 win32-x64-msvc win32-arm64-msvc; do
            tarballs+=("@nervekit/native-${triple}|release/npm/nervekit-native-${triple}-${version}.tgz")
          done
          tarballs+=("@nervekit/desktop|release/npm/nervekit-desktop-${version}.tgz")
          for entry in "${tarballs[@]}"; do
            name="${entry%%|*}"
            tgz="${entry#*|}"
            if [ ! -f "${tgz}" ]; then
              echo "No verified tarball found at ${tgz}" >&2
              exit 1
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            echo "Publishing ${tgz} as ${name}@${version} with dist-tag ${dist_tag}"
            npm publish "${tgz}" --provenance --access public --tag "${dist_tag}"
          done

  deploy-website:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Deploy website
    runs-on: ubuntu-latest
    needs:
      - build-website
      - publish-npm
    concurrency:
      group: github-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - publish-npm
    permissions:
      contents: write

    steps:
      - name: Download verified npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: release/npm

      - name: Create release and attach npm tarballs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tgz=(release/npm/nervekit-desktop-"${version}".tgz release/npm/nervekit-native-*-"${version}".tgz)
          if [ "${#tgz[@]}" -ne 7 ] || [ ! -f "${tgz[0]}" ]; then
            echo "Expected 7 verified tarballs in release/npm, found: ${tgz[*]}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing its npm tarballs"
            gh release upload "${RELEASE_TAG}" "${tgz[@]}" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${version}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${tgz[@]}" "${release_args[@]}"
