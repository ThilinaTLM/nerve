name: Publish Release

on:
  push:
    tags:
      # Stable releases: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases: v1.2.3-rc.1, v1.2.3-beta.2, etc.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  repository_dispatch:
    types:
      - release-tagged

env:
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest

    steps:
      - name: Require a release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "${RELEASE_TAG}"

  native-prebuilds:
    name: Native prebuild (${{ matrix.target }})
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            node_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            node_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Verify runner architecture
        env:
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_NODE_ARCH) throw new Error('Expected ' + process.env.EXPECTED_NODE_ARCH + ', got ' + process.arch)"
      - name: Build native prebuild
        working-directory: packages/native
        run: pnpm exec napi build --cwd native --package-json-path ../package.json --platform --release --target ${{ matrix.target }} --output-dir ../prebuilds
      - name: Test native prebuild
        run: pnpm --filter @nervekit/native test
      - uses: actions/upload-artifact@v6
        with:
          name: native-prebuild-${{ matrix.target }}
          path: packages/native/prebuilds/*.node
          if-no-files-found: error

  quality-and-package:
    name: Check, test, build, and package (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - native-prebuilds
    timeout-minutes: 30

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native prebuilds
        uses: actions/download-artifact@v7
        with:
          pattern: native-prebuild-*
          path: packages/native/prebuilds
          merge-multiple: true

      - name: Verify native prebuild inventory
        run: node scripts/verify-native-prebuilds.mjs

      - name: Check formatting, lint, and packages
        run: pnpm check

      - name: Run complete test suite
        run: pnpm test

      - name: Remove developer native prebuild
        run: rm -rf packages/native/prebuilds/local

      - name: Build all packages
        run: pnpm build

      - name: Smoke built workbench HTTP and WebSocket parity
        run: node scripts/smoke-workbench-release.mjs

      - name: Smoke desktop resolution and CLI
        run: node scripts/smoke-desktop-release.mjs

      - name: Package unpacked desktop bundle
        run: pnpm --filter @nervekit/desktop-shell package:dir

      - name: Smoke packaged desktop identity and assets
        run: node scripts/smoke-desktop-package.mjs

      - name: Pack and verify npm tarball
        run: node scripts/pack-npm.mjs

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  native-package-smoke:
    name: npm package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - verify-tag
      - native-prebuilds
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native prebuilds
        uses: actions/download-artifact@v7
        with:
          pattern: native-prebuild-*
          path: packages/native/prebuilds
          merge-multiple: true

      - name: Verify native prebuild inventory
        run: node scripts/verify-native-prebuilds.mjs

      - name: Build all packages
        run: pnpm build

      - name: Run native tool and desktop tests
        run: pnpm --filter @nervekit/tools --filter @nervekit/desktop-shell test

      - name: Package unpacked desktop bundle
        run: pnpm --filter @nervekit/desktop-shell package:dir

      - name: Smoke packaged desktop identity and assets
        run: node scripts/smoke-desktop-package.mjs

      - name: Pack and verify npm tarball
        run: node scripts/pack-npm.mjs

      - name: Verify built desktop runtime
        run: node scripts/smoke-desktop-release.mjs

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - quality-and-package
      - native-package-smoke
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check website
        run: pnpm --filter @nervekit/website check

      - name: Build website
        run: pnpm --filter @nervekit/website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/website/dist

  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - quality-and-package
      - native-package-smoke
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Node 24 and npm >= 11.5.1
        shell: bash
        run: |
          node_version="$(node --version)"
          echo "node: ${node_version}"
          case "${node_version}" in
            v24.*) ;;
            *) echo "Expected Node 24, got ${node_version}" >&2; exit 1 ;;
          esac
          npm_version="$(npm --version)"
          echo "npm: ${npm_version}"
          # Trusted publishing (OIDC) requires npm >= 11.5.1.
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm to satisfy trusted publishing (>= 11.5.1)"
            npm install -g npm@latest
            echo "npm: $(npm --version)"
          fi

      - name: Download verified npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release/npm

      - name: Publish npm tarball
        shell: bash
        run: |
          set -euo pipefail
          name="@nervekit/desktop"
          version="${RELEASE_TAG#v}"
          tgz="release/npm/nervekit-desktop-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "Skipping ${name}@${version} (already published)"
            exit 0
          fi
          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            dist_tag="next"
          fi
          echo "Publishing ${tgz} as ${name}@${version} with dist-tag ${dist_tag}"
          npm publish "${tgz}" --provenance --access public --tag "${dist_tag}"

  deploy-website:
    name: Deploy website
    runs-on: ubuntu-latest
    needs:
      - build-website
      - publish-npm
    concurrency:
      group: github-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - publish-npm
    permissions:
      contents: write

    steps:
      - name: Download verified npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release/npm

      - name: Create release and attach npm tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tgz="release/npm/nervekit-desktop-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing its npm tarball"
            gh release upload "${RELEASE_TAG}" "${tgz}" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${version}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${tgz}" "${release_args[@]}"
