name: Release

on:
  push:
    tags:
      # Stable releases: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases: v1.2.3-rc.1, v1.2.3-beta.2, etc.
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "${{ github.ref_name }}"

  quality-and-package:
    name: Check, test, build, and package (Ubuntu)
    runs-on: ubuntu-latest
    needs: verify-tag
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and packages
        run: pnpm check

      - name: Run complete test suite
        run: pnpm test

      - name: Build all packages
        run: pnpm build

      - name: Smoke built workbench HTTP and WebSocket parity
        run: pnpm release:smoke:workbench

      - name: Smoke desktop resolution and CLI
        run: pnpm release:smoke:desktop

      - name: Package unpacked desktop bundle
        run: pnpm --filter @nervekit/desktop-shell package:dir

      - name: Smoke packaged desktop identity and assets
        run: pnpm release:smoke:desktop-package

      - name: Pack and verify npm tarball
        run: node scripts/pack-npm.mjs

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  native-package-smoke:
    name: npm package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify-tag
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run native tool and desktop tests
        run: pnpm --filter @nervekit/tools --filter @nervekit/desktop-shell test

      - name: Package unpacked desktop bundle
        run: pnpm --filter @nervekit/desktop-shell package:dir

      - name: Smoke packaged desktop identity and assets
        run: pnpm release:smoke:desktop-package

      - name: Pack and verify npm tarball
        run: node scripts/pack-npm.mjs

      - name: Verify built desktop runtime
        run: pnpm release:smoke:desktop

  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs:
      - quality-and-package
      - native-package-smoke
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Node 24 and npm >= 11.5.1
        shell: bash
        run: |
          node_version="$(node --version)"
          echo "node: ${node_version}"
          case "${node_version}" in
            v24.*) ;;
            *) echo "Expected Node 24, got ${node_version}" >&2; exit 1 ;;
          esac
          npm_version="$(npm --version)"
          echo "npm: ${npm_version}"
          # Trusted publishing (OIDC) requires npm >= 11.5.1.
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm to satisfy trusted publishing (>= 11.5.1)"
            npm install -g npm@latest
            echo "npm: $(npm --version)"
          fi

      - name: Download verified npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release/npm

      - name: Publish npm tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="@nervekit/desktop"
          version="${RELEASE_TAG#v}"
          tgz="release/npm/nervekit-desktop-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "Skipping ${name}@${version} (already published)"
            exit 0
          fi
          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            dist_tag="next"
          fi
          echo "Publishing ${tgz} as ${name}@${version} with dist-tag ${dist_tag}"
          npm publish "${tgz}" --provenance --access public --tag "${dist_tag}"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write

    steps:
      - name: Download verified npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release/npm

      - name: Create release and attach npm tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tgz="release/npm/nervekit-desktop-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing its npm tarball"
            gh release upload "${RELEASE_TAG}" "${tgz}" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${version}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${tgz}" "${release_args[@]}"
