name: Release

on:
  push:
    tags:
      # Stable releases: v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-releases: v1.2.3-rc.1, v1.2.3-beta.2, etc.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer without v (for example, 1.2.3 or 1.2.3-rc.1)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    name: Bump version and create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.push.outputs.release_tag }}
      release_sha: ${{ steps.push.outputs.release_sha }}

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump workspace versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/bump-release-version.mjs "${RELEASE_VERSION}"

      - name: Verify and push release commit and tag
        id: push
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_AUTHOR_ID: ${{ github.actor_id }}
          RELEASE_AUTHOR_NAME: ${{ github.actor }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          node scripts/verify-release-tag.mjs "${release_tag}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json
          if ! git diff --cached --quiet; then
            git commit \
              --author="${RELEASE_AUTHOR_NAME} <${RELEASE_AUTHOR_ID}+${RELEASE_AUTHOR_NAME}@users.noreply.github.com>" \
              -m "chore(release): bump version to ${release_tag}"
          else
            echo "Workspace is already at ${release_tag}; reusing the current commit"
          fi

          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${release_tag}")"
            head_sha="$(git rev-parse HEAD)"
            if [ "${tag_sha}" != "${head_sha}" ]; then
              echo "Tag ${release_tag} already points to ${tag_sha}, not ${head_sha}" >&2
              exit 1
            fi
            echo "Tag ${release_tag} already points to the release commit"
          else
            git tag -a "${release_tag}" -m "Release ${release_tag}"
          fi

          git push --atomic origin \
            "HEAD:refs/heads/${DEFAULT_BRANCH}" \
            "refs/tags/${release_tag}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  verify-tag:
    name: Verify release tag
    needs: prepare-release
    if: >-
      always() &&
      (needs.prepare-release.result == 'success' ||
       needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_sha: ${{ steps.context.outputs.release_sha }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve release context
        id: context
        shell: bash
        env:
          PREPARED_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          PREPARED_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          PUSHED_TAG: ${{ github.ref_name }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          echo "release_tag=${PREPARED_TAG:-${PUSHED_TAG}}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${PREPARED_SHA:-${PUSHED_SHA}}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "${{ steps.context.outputs.release_tag }}"

  quality-and-package:
    name: Check, test, build, and package (Ubuntu)
    runs-on: ubuntu-latest
    needs: verify-tag
    timeout-minutes: 30

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and packages
        run: pnpm check

      - name: Run complete test suite
        run: pnpm test

      - name: Build all packages
        run: pnpm build

      - name: Smoke built workbench HTTP and WebSocket parity
        run: pnpm release:smoke:workbench

      - name: Smoke desktop resolution and CLI
        run: pnpm release:smoke:desktop

      - name: Package unpacked desktop bundle
        run: pnpm --filter @nervekit/desktop-shell package:dir

      - name: Smoke packaged desktop identity and assets
        run: pnpm release:smoke:desktop-package

      - name: Pack and verify npm tarball
        run: node scripts/pack-npm.mjs

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: release/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  native-package-smoke:
    name: npm package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify-tag
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-tag.outputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run native tool and desktop tests
        run: pnpm --filter @nervekit/tools --filter @nervekit/desktop-shell test

      - name: Package unpacked desktop bundle
        run: pnpm --filter @nervekit/desktop-shell package:dir

      - name: Smoke packaged desktop identity and assets
        run: pnpm release:smoke:desktop-package

      - name: Pack and verify npm tarball
        run: node scripts/pack-npm.mjs

      - name: Verify built desktop runtime
        run: pnpm release:smoke:desktop

  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - quality-and-package
      - native-package-smoke
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify Node 24 and npm >= 11.5.1
        shell: bash
        run: |
          node_version="$(node --version)"
          echo "node: ${node_version}"
          case "${node_version}" in
            v24.*) ;;
            *) echo "Expected Node 24, got ${node_version}" >&2; exit 1 ;;
          esac
          npm_version="$(npm --version)"
          echo "npm: ${npm_version}"
          # Trusted publishing (OIDC) requires npm >= 11.5.1.
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "Upgrading npm to satisfy trusted publishing (>= 11.5.1)"
            npm install -g npm@latest
            echo "npm: $(npm --version)"
          fi

      - name: Download verified npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release/npm

      - name: Publish npm tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          name="@nervekit/desktop"
          version="${RELEASE_TAG#v}"
          tgz="release/npm/nervekit-desktop-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "Skipping ${name}@${version} (already published)"
            exit 0
          fi
          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            dist_tag="next"
          fi
          echo "Publishing ${tgz} as ${name}@${version} with dist-tag ${dist_tag}"
          npm publish "${tgz}" --provenance --access public --tag "${dist_tag}"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-tag
      - publish-npm
    permissions:
      contents: write

    steps:
      - name: Download verified npm tarball
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: release/npm

      - name: Create release and attach npm tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          tgz="release/npm/nervekit-desktop-${version}.tgz"
          if [ ! -f "${tgz}" ]; then
            echo "No verified tarball found at ${tgz}" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refreshing its npm tarball"
            gh release upload "${RELEASE_TAG}" "${tgz}" --clobber
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${version}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${tgz}" "${release_args[@]}"
