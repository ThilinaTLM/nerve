name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  paths:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      testable: ${{ steps.filter.outputs.testable }}
      website: ${{ steps.filter.outputs.website }}
      workbench: ${{ steps.filter.outputs.workbench }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          predicate-quantifier: "some-with-excludes"
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!README.md'
              - '!NOTICE'
            testable:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!README.md'
              - '!NOTICE'
              - '!packages/website/**'
            website:
              - '.github/workflows/ci.yml'
              - 'packages/website/**'
              - 'packages/ui-kit/src/styles/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            workbench:
              - '.github/workflows/ci.yml'
              - 'packages/workbench-server/**'
              - 'packages/workbench-app/**'
              - 'packages/ui-kit/**'
              - 'packages/contracts/**'
              - 'packages/protocol/**'
              - 'packages/harness/**'
              - 'packages/tools/**'
              - 'packages/native/**'
              - 'scripts/copy-workbench-app-dist-to-workbench-server.mjs'
              - 'scripts/smoke-workbench-release.mjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

  storage-windows:
    name: Storage migrations (Windows)
    runs-on: windows-latest
    needs: paths
    if: github.event_name != 'pull_request' || needs.paths.outputs.workbench == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native host and type dependencies
        run: pnpm build:native && pnpm --filter @nervekit/workbench-server... check
      - name: Run storage migration tests on native Windows filesystems
        run: pnpm --filter @nervekit/workbench-server test:migrations

  validate:
    name: Check and test (Ubuntu)
    runs-on: ubuntu-latest
    needs: paths

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast baseline (format, lint, boundaries, scripts tests)
        run: pnpm exec oxfmt --check && pnpm exec eslint . && node scripts/check-package-boundaries.mjs && node --test "scripts/**/*.test.mjs"

      - name: Typecheck and check all packages
        if: github.event_name != 'pull_request' || needs.paths.outputs.code == 'true'
        run: pnpm -r check

      - name: Run complete test suite
        if: github.event_name != 'pull_request' || needs.paths.outputs.testable == 'true'
        run: pnpm run test:full

      - name: Build workbench runtime
        if: github.event_name != 'pull_request' || needs.paths.outputs.workbench == 'true'
        run: pnpm build:workbench-runtime

      - name: Smoke built workbench HTTP and WebSocket parity
        if: github.event_name != 'pull_request' || needs.paths.outputs.workbench == 'true'
        run: node scripts/smoke-workbench-release.mjs

  website:
    name: Check and build website
    runs-on: ubuntu-latest
    needs: paths
    if: github.event_name != 'pull_request' || needs.paths.outputs.website == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website
        run: pnpm --filter @nervekit/website check
      - name: Test website
        run: pnpm --filter @nervekit/website test
      - name: Build website
        run: pnpm --filter @nervekit/website build

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - paths
      - storage-windows
      - validate
      - website

    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          STORAGE_RESULT: ${{ needs.storage-windows.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          set -euo pipefail
          if [ "${PATHS_RESULT}" != "success" ] || [ "${VALIDATE_RESULT}" != "success" ]; then
            echo "Required CI job failed: paths=${PATHS_RESULT}, validate=${VALIDATE_RESULT}" >&2
            exit 1
          fi
          for result in "${STORAGE_RESULT}" "${WEBSITE_RESULT}"; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "Conditional CI job failed: storage=${STORAGE_RESULT}, website=${WEBSITE_RESULT}" >&2
              exit 1
            fi
          done
          echo "CI passed: paths=${PATHS_RESULT}, validate=${VALIDATE_RESULT}, storage=${STORAGE_RESULT}, website=${WEBSITE_RESULT}"
