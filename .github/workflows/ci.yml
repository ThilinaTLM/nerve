name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  paths:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      testable: ${{ steps.filter.outputs.testable }}
      workbench: ${{ steps.filter.outputs.workbench }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          predicate-quantifier: "some-with-excludes"
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!README.md'
              - '!NOTICE'
            testable:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!README.md'
              - '!NOTICE'
              - '!packages/website/**'
            workbench:
              - 'packages/workbench-server/**'
              - 'packages/workbench-app/**'
              - 'packages/ui-kit/**'
              - 'packages/contracts/**'
              - 'packages/protocol/**'
              - 'packages/harness/**'
              - 'packages/tools/**'
              - 'packages/native/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'

  storage-windows:
    name: Storage migrations (Windows)
    runs-on: windows-latest
    needs: paths
    if: github.event_name != 'pull_request' || needs.paths.outputs.workbench == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native host and type dependencies
        run: pnpm build:native && pnpm --filter @nervekit/workbench-server... check
      - name: Run storage migration tests on native Windows filesystems
        run: pnpm --filter @nervekit/workbench-server test:migrations

  validate:
    name: Check and test (Ubuntu)
    runs-on: ubuntu-latest
    needs: paths

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast baseline (format, lint, boundaries, scripts tests)
        run: pnpm exec oxfmt --check && pnpm exec eslint . && node scripts/check-package-boundaries.mjs && node --test "scripts/**/*.test.mjs"

      - name: Typecheck and check all packages
        if: github.event_name != 'pull_request' || needs.paths.outputs.code == 'true'
        run: pnpm -r check

      - name: Run complete test suite
        if: github.event_name != 'pull_request' || needs.paths.outputs.testable == 'true'
        run: pnpm run test:full

      - name: Build workbench runtime
        if: github.event_name != 'pull_request' || needs.paths.outputs.workbench == 'true'
        run: pnpm build:workbench-runtime

      - name: Smoke built workbench HTTP and WebSocket parity
        if: github.event_name != 'pull_request' || needs.paths.outputs.workbench == 'true'
        run: node scripts/smoke-workbench-release.mjs
