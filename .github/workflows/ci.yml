name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Check and test (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, and packages
        run: pnpm check

      - name: Run complete test suite
        run: pnpm test

      - name: Build workbench runtime
        run: pnpm build:workbench-runtime

      - name: Smoke built workbench HTTP and WebSocket parity
        run: pnpm release:smoke:workbench

  gpui-experiment:
    name: Experimental GPUI client (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting and Clippy
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings

      - name: Test and build experimental client
        run: cargo test --workspace && cargo build --workspace
