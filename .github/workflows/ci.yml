name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  paths:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.impact.outputs.full || steps.impact_main.outputs.full }}
      packages: ${{ steps.impact.outputs.packages || steps.impact_main.outputs.packages }}
      dependency_packages: ${{ steps.impact.outputs.dependency_packages || steps.impact_main.outputs.dependency_packages }}
      has_packages: ${{ steps.impact.outputs.has_packages || steps.impact_main.outputs.has_packages }}
      website: ${{ steps.impact.outputs.website || steps.impact_main.outputs.website }}
      workbench: ${{ steps.impact.outputs.workbench || steps.impact_main.outputs.workbench }}
      electron_smoke: ${{ steps.impact.outputs.electron_smoke || steps.impact_main.outputs.electron_smoke }}
      native: ${{ steps.impact.outputs.native || steps.impact_main.outputs.native }}
      native_matrix: ${{ steps.impact.outputs.native_matrix || steps.impact_main.outputs.native_matrix }}
      native_matrix_needed: ${{ steps.impact.outputs.native_matrix_needed || steps.impact_main.outputs.native_matrix_needed }}
      native_os_matrix: ${{ steps.impact.outputs.native_os_matrix || steps.impact_main.outputs.native_os_matrix }}
      native_os_needed: ${{ steps.impact.outputs.native_os_needed || steps.impact_main.outputs.native_os_needed }}
      rust_lint: ${{ steps.impact.outputs.rust_lint || steps.impact_main.outputs.rust_lint }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify pull request impact
        id: impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/testing/ci-impact.mjs --base "${BASE_SHA}"

      - name: Select full coverage for main
        id: impact_main
        if: github.event_name != 'pull_request'
        run: node scripts/testing/ci-impact.mjs --full

  lint:
    name: Format, lint and script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec oxfmt --check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec eslint .
      - name: Check package boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/checks/check-package-boundaries.mjs
      - name: Build contracts for scripts tests
        id: contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Storage script tests import workbench-server sources that resolve @nervekit/contracts from dist.
        run: pnpm --filter @nervekit/contracts build
      - name: Run scripts tests
        if: ${{ !cancelled() && steps.contracts.outcome == 'success' }}
        run: pnpm test:scripts

  native-linux:
    name: Build native addon (Linux)
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.native == 'true'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore native addon cache
        id: addon
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/native/prebuilds/local
          # Changes only when Rust sources, locks, the toolchain or the build
          # command change. Bump the v1 prefix to invalidate manually.
          key: native-addon-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/native/native/**', 'packages/native/package.json') }}

      - name: Set up pnpm
        if: steps.addon.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.addon.outputs.cache-hit != 'true' && 'pnpm' || '' }}
      - name: Set up Rust
        if: steps.addon.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Cache Rust dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-addon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build native runtime
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm build:native

      - name: Smoke-load native addon
        run: node scripts/testing/smoke-native-addon.mjs
      - name: Pack native addon
        run: tar -cf native-addon.tar -C packages/native/prebuilds local
      - name: Upload native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: native-addon.tar
          if-no-files-found: error
          retention-days: 1

  native-os:
    name: Build native addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: paths
    if: needs.paths.outputs.native_os_needed == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.paths.outputs.native_os_matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore native addon cache
        id: addon
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/native/prebuilds/local
          # Changes only when Rust sources, locks, the toolchain or the build
          # command change. Bump the v1 prefix to invalidate manually.
          key: native-addon-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/native/native/**', 'packages/native/package.json') }}

      - name: Set up pnpm
        if: steps.addon.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.addon.outputs.cache-hit != 'true' && 'pnpm' || '' }}
      - name: Set up Rust
        if: steps.addon.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Cache Rust dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-addon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build native runtime
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm build:native

      - name: Smoke-load native addon
        run: node scripts/testing/smoke-native-addon.mjs
      - name: Pack native addon
        run: tar -cf native-addon.tar -C packages/native/prebuilds local
      - name: Upload native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: native-addon.tar
          if-no-files-found: error
          retention-days: 1

  rust-lint:
    name: Rust format and clippy
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.rust_lint == 'true'
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Rust formatting and clippy
        run: pnpm --filter @nervekit/native check:native

  validate:
    name: Check and test affected packages (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && (needs.native-linux.result == 'success' || needs.native-linux.result == 'skipped') && needs.paths.outputs.has_packages == 'true' && needs.paths.outputs.full != 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        if: needs.paths.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        if: needs.paths.outputs.native == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: validate
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        if: needs.paths.outputs.native == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        if: needs.paths.outputs.native == 'true'
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.mjs

      - name: Prepare affected package dependencies
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.dependency_packages }}
        run: node scripts/testing/run-affected-packages.mjs build

      - name: Check affected packages
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.packages }}
        run: node scripts/testing/run-affected-packages.mjs check

      - name: Test affected packages
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.packages }}
        run: node scripts/testing/run-affected-packages.mjs test

  typecheck:
    name: Type and lint checks (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && needs.native-linux.result == 'success' && needs.paths.outputs.full == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: typecheck
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.mjs

      - name: Check all packages
        run: pnpm -r check

  package-tests:
    name: Package tests (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && needs.native-linux.result == 'success' && needs.paths.outputs.full == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.mjs

      # Tests import workspace packages through their emitted dist, which the
      # type-check job produces in its own workspace. Frontend packages and the
      # desktop shell are not consumed through dist by any test.
      - name: Build workspace package outputs
        run: pnpm -r --filter '!nerve' --filter '!@nervekit/desktop-shell' --filter '!@nervekit/workbench-app' --filter '!@nervekit/ui-kit' --filter '!@nervekit/website' --if-present build

      # Pull requests run the same tests without c8 instrumentation; coverage
      # is collected and uploaded on main only.
      - name: Run complete package test suite
        if: github.event_name == 'pull_request'
        run: pnpm run test:packages

      - name: Run complete package test suite with coverage
        if: github.event_name != 'pull_request'
        run: pnpm run test:packages:coverage

      - name: Upload coverage report
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    name: Workbench browser tests
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && needs.native-linux.result == 'success' && needs.paths.outputs.workbench == 'true' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.mjs
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Build workbench runtime
        run: pnpm build:workbench-runtime
      - name: Smoke Electron image normalization
        if: needs.paths.outputs.electron_smoke == 'true'
        run: xvfb-run -a node scripts/release/smoke-electron-image-resize.mjs
      - name: Smoke built workbench HTTP and WebSocket parity
        run: node scripts/release/smoke-workbench-release.mjs
      - name: Run browser tests
        run: pnpm exec playwright test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: Check and build website
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.website == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website
        run: pnpm --filter @nervekit/website check
      - name: Test website
        run: pnpm --filter @nervekit/website test
      - name: Build website
        run: pnpm --filter @nervekit/website build

  component-tests:
    name: UI component tests
    runs-on: ubuntu-latest
    needs: paths
    # Install only (no native or workbench build), off the critical path.
    if: ${{ needs.paths.outputs.full == 'true' || contains(fromJSON(needs.paths.outputs.packages), '@nervekit/ui-kit') }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ui-kit component tests
        run: pnpm --filter @nervekit/ui-kit test:components

  knip:
    name: Unused exports (advisory)
    runs-on: ubuntu-latest
    needs: paths
    # Advisory until the baseline is triaged: not part of the CI gate.
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Report unused code
        run: pnpm knip --reporter compact

  native-tests:
    name: Native ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }} tests (${{ matrix.os }})
    needs:
      - paths
      - native-os
    if: ${{ !cancelled() && needs.native-os.result == 'success' && needs.paths.outputs.native_matrix_needed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.paths.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        if: matrix.suite == 'host-native'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Cache Rust dependencies
        if: matrix.suite == 'host-native'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.mjs

      # cargo fmt and clippy are OS-independent and run once on Ubuntu
      # (validate or rust-lint); only cargo test and tsx tests run per OS.
      - name: Run native runtime tests
        if: matrix.suite == 'host-native'
        run: pnpm --filter @nervekit/native test

      - name: Build native server packages
        if: matrix.suite == 'host-server' || matrix.suite == 'host-migrations'
        run: pnpm --filter @nervekit/workbench-server... build
      - name: Run native server tests
        if: matrix.suite == 'host-server'
        timeout-minutes: 8
        run: pnpm --filter @nervekit/workbench-server test:native
      # Same globs as the workbench-server test:migrations script, sharded
      # (pnpm does not forward extra flags past the script's globs).
      - name: Run storage migration tests on native filesystems
        if: matrix.suite == 'host-migrations'
        run: pnpm --filter @nervekit/workbench-server exec tsx --test --test-concurrency=1 --test-shard=${{ matrix.shard }} "src/infrastructure/migrations/**/*.test.ts" "test/infrastructure/persistence/*.test.ts"

      - name: Build native tool packages
        if: matrix.suite == 'host-tools'
        run: pnpm --filter @nervekit/tools... build
      - name: Run tool tests on native Windows filesystems
        if: matrix.suite == 'host-tools' && runner.os == 'Windows'
        run: pnpm --filter @nervekit/tools test
      - name: Run native tool tests on macOS
        if: matrix.suite == 'host-tools' && runner.os == 'macOS'
        run: pnpm --filter @nervekit/tools test:native

      - name: Build native desktop runtime
        if: matrix.suite == 'desktop'
        run: pnpm build:workbench-runtime && pnpm --filter @nervekit/desktop-shell build
      - name: Run desktop tests
        if: matrix.suite == 'desktop'
        timeout-minutes: 8
        run: pnpm --filter @nervekit/desktop-shell test

  native-gate:
    name: Native host gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - paths
      - native-os
      - native-tests

    steps:
      - name: Require successful native host jobs
        shell: bash
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          BUILD_RESULT: ${{ needs.native-os.result }}
          TEST_RESULT: ${{ needs.native-tests.result }}
        run: |
          set -euo pipefail
          if [ "${PATHS_RESULT}" != "success" ]; then
            echo "Native path detection failed: ${PATHS_RESULT}" >&2
            exit 1
          fi
          if [ "${BUILD_RESULT}" != "success" ] && [ "${BUILD_RESULT}" != "skipped" ]; then
            echo "Native addon build failed: ${BUILD_RESULT}" >&2
            exit 1
          fi
          if [ "${TEST_RESULT}" != "success" ] && [ "${TEST_RESULT}" != "skipped" ]; then
            echo "Native test matrix failed: ${TEST_RESULT}" >&2
            exit 1
          fi
          echo "Native host CI passed: paths=${PATHS_RESULT}, build=${BUILD_RESULT}, tests=${TEST_RESULT}"

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - paths
      - lint
      - native-linux
      - rust-lint
      - validate
      - typecheck
      - package-tests
      - browser-tests
      - website
      - component-tests
      - native-gate

    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          NATIVE_RESULT: ${{ needs.native-gate.result }}
          CONDITIONAL_RESULTS: >-
            native-linux=${{ needs.native-linux.result }}
            rust-lint=${{ needs.rust-lint.result }}
            validate=${{ needs.validate.result }}
            typecheck=${{ needs.typecheck.result }}
            package-tests=${{ needs.package-tests.result }}
            browser=${{ needs.browser-tests.result }}
            website=${{ needs.website.result }}
            component-tests=${{ needs.component-tests.result }}
        run: |
          set -euo pipefail
          if [ "${PATHS_RESULT}" != "success" ] || [ "${LINT_RESULT}" != "success" ] || [ "${NATIVE_RESULT}" != "success" ]; then
            echo "Required CI job failed: paths=${PATHS_RESULT}, lint=${LINT_RESULT}, native=${NATIVE_RESULT}" >&2
            exit 1
          fi
          # Conditional jobs are skipped when their area is unaffected. A skip
          # caused by a failed dependency is caught by that dependency's own
          # result (native-linux, paths) above or here.
          for entry in ${CONDITIONAL_RESULTS}; do
            result="${entry#*=}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "Conditional CI job failed: ${entry}" >&2
              exit 1
            fi
          done
          echo "CI passed: paths=${PATHS_RESULT}, lint=${LINT_RESULT}, native=${NATIVE_RESULT}, ${CONDITIONAL_RESULTS}"
