name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a pull request cancels its superseded run. Other events get a
# unique group: a shared group would cancel pending main runs, and the release
# workflow requires the main run of the release commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paths:
    name: Changes / Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.impact.outputs.full || steps.impact_main.outputs.full }}
      packages: ${{ steps.impact.outputs.packages || steps.impact_main.outputs.packages }}
      dependency_packages: ${{ steps.impact.outputs.dependency_packages || steps.impact_main.outputs.dependency_packages }}
      has_packages: ${{ steps.impact.outputs.has_packages || steps.impact_main.outputs.has_packages }}
      website: ${{ steps.impact.outputs.website || steps.impact_main.outputs.website }}
      workbench: ${{ steps.impact.outputs.workbench || steps.impact_main.outputs.workbench }}
      electron_smoke: ${{ steps.impact.outputs.electron_smoke || steps.impact_main.outputs.electron_smoke }}
      native: ${{ steps.impact.outputs.native || steps.impact_main.outputs.native }}
      native_windows_suites: ${{ steps.impact.outputs.native_windows_suites || steps.impact_main.outputs.native_windows_suites }}
      native_macos_suites: ${{ steps.impact.outputs.native_macos_suites || steps.impact_main.outputs.native_macos_suites }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The classifier is plain erasable TypeScript run by Node's native type
      # stripping, so this job needs no pnpm install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Classify pull request impact
        id: impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/impact/ci.ts --base "${BASE_SHA}"

      - name: Select full coverage for main
        id: impact_main
        if: github.event_name != 'pull_request'
        run: node scripts/impact/ci.ts --full

  lint:
    name: Lint / Format, lint, policies and script tests
    runs-on: ubuntu-latest
    needs: paths
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages imported by scripts
        id: workspace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Storage scripts import workbench-server sources, which resolve their
        # workspace dependencies (types and runtime) from dist; release smoke scripts
        # import desktop-shell dist (types only here, so plain tsc without icons/preload).
        run: |
          pnpm --filter "@nervekit/desktop-shell^..." build
          pnpm --filter @nervekit/desktop-shell exec tsc -b
      # Independent checks run as parallel steps (workflow syntax: jobs.<job_id>.steps[*].parallel);
      # every step finishes before the job reports, so one failure never hides another.
      - parallel:
          - name: Check formatting
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: pnpm exec oxfmt --check
          - name: Lint
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: pnpm exec eslint .
          - name: Check package boundaries
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: node scripts/checks/check-package-boundaries.ts
          - name: Check for unused files, exports and dependencies (knip)
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            # Intentional exceptions live in knip.jsonc with a reason.
            run: pnpm knip --reporter compact
          - name: Run ui-kit component tests
            if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.paths.outputs.full == 'true' || contains(fromJSON(needs.paths.outputs.packages), '@nervekit/ui-kit')) }}
            run: pnpm --filter @nervekit/ui-kit test:components
          - name: Type-check scripts
            if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
            run: pnpm exec tsc -p scripts
          - name: Run scripts tests
            if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
            run: pnpm test:scripts

  native-linux:
    name: Native / Build addon (Linux)
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.native == 'true'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore native addon cache
        id: addon
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/native/prebuilds/local
          # Changes only when Rust sources, locks, the toolchain or the build
          # command change. Bump the v1 prefix to invalidate manually.
          key: native-addon-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/native/native/**', 'packages/native/package.json') }}

      - name: Set up pnpm
        if: steps.addon.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.addon.outputs.cache-hit != 'true' && 'pnpm' || '' }}
      - name: Set up Rust
        if: steps.addon.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Cache Rust dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-addon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build native runtime
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm build:native

      - name: Smoke-load native addon
        run: node scripts/testing/smoke-native-addon.ts
      - name: Pack native addon
        run: tar -cf native-addon.tar -C packages/native/prebuilds local
      - name: Upload native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: native-addon.tar
          if-no-files-found: error
          retention-days: 1

  native-addon-windows:
    name: Native / Build addon (Windows)
    runs-on: windows-latest
    needs: paths
    if: needs.paths.outputs.native_windows_suites != '[]'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    # The steps are shared with the macOS job through a YAML anchor
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations).
    steps: &native_addon_steps
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore native addon cache
        id: addon
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/native/prebuilds/local
          # Changes only when Rust sources, locks, the toolchain or the build
          # command change. Bump the v1 prefix to invalidate manually.
          key: native-addon-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/native/native/**', 'packages/native/package.json') }}

      - name: Set up pnpm
        if: steps.addon.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ steps.addon.outputs.cache-hit != 'true' && 'pnpm' || '' }}
      - name: Set up Rust
        if: steps.addon.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Cache Rust dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-addon
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build native runtime
        if: steps.addon.outputs.cache-hit != 'true'
        run: pnpm build:native

      - name: Smoke-load native addon
        run: node scripts/testing/smoke-native-addon.ts
      - name: Pack native addon
        run: tar -cf native-addon.tar -C packages/native/prebuilds local
      - name: Upload native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: native-addon.tar
          if-no-files-found: error
          retention-days: 1

  native-addon-macos:
    name: Native / Build addon (macOS)
    runs-on: macos-latest
    needs: paths
    if: needs.paths.outputs.native_macos_suites != '[]'
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps: *native_addon_steps

  # Narrow (non-full) pull requests: the package check (~1 min) and the package
  # tests (~3-4 min) are independent, so they run as two parallel jobs instead
  # of back to back. Each repeats only install + dependency prep; the steps are
  # shared through a YAML anchor and select their task through `env.TASK`.
  validate-check:
    name: Packages / Affected checks (Ubuntu)
    runs-on: ubuntu-latest
    env:
      TASK: check
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && (needs.native-linux.result == 'success' || needs.native-linux.result == 'skipped') && needs.paths.outputs.has_packages == 'true' && needs.paths.outputs.full != 'true' }}

    steps: &validate_steps
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        if: needs.paths.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        if: needs.paths.outputs.native == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: validate
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        if: needs.paths.outputs.native == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        if: needs.paths.outputs.native == 'true'
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.ts

      - name: Prepare affected package dependencies
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.dependency_packages }}
        run: node scripts/testing/run-affected-packages.ts build

      - name: Check affected packages
        if: env.TASK == 'check'
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.packages }}
        run: node scripts/testing/run-affected-packages.ts check

      # The migration registry loads the native addon. Migration inputs always
      # affect workbench-server, which selects the addon (`native`).
      - name: Check storage migration lock
        if: env.TASK == 'check' && needs.paths.outputs.native == 'true'
        run: pnpm migrations:check

      # Tests of one affected package import another affected package's dist
      # (e.g. conversation-core tests import @nervekit/tools/dist), and only the
      # check entry builds them implicitly via tsc -b.
      - name: Build affected packages
        if: env.TASK == 'test'
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.packages }}
        run: node scripts/testing/run-affected-packages.ts build

      - name: Test affected packages
        if: env.TASK == 'test'
        env:
          NERVE_AFFECTED_PACKAGES: ${{ needs.paths.outputs.packages }}
        run: node scripts/testing/run-affected-packages.ts test

  validate-test:
    name: Packages / Affected tests (Ubuntu)
    runs-on: ubuntu-latest
    env:
      TASK: test
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && (needs.native-linux.result == 'success' || needs.native-linux.result == 'skipped') && needs.paths.outputs.has_packages == 'true' && needs.paths.outputs.full != 'true' }}

    steps: *validate_steps

  typecheck:
    name: Packages / All checks (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && needs.native-linux.result == 'success' && needs.paths.outputs.full == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: typecheck
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.ts

      - name: Check all packages
        run: pnpm -r check

      # Needs the native addon unpacked above.
      - name: Check storage migration lock
        run: pnpm migrations:check

  package-tests:
    name: Packages / All tests (Ubuntu)
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && needs.native-linux.result == 'success' && needs.paths.outputs.full == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.ts

      # Tests import workspace packages through their emitted dist, which the
      # type-check job produces in its own workspace. Frontend packages and the
      # desktop shell are not consumed through dist by any test.
      - name: Build workspace package outputs
        run: pnpm -r --filter '!nerve' --filter '!@nervekit/desktop-shell' --filter '!@nervekit/workbench-app' --filter '!@nervekit/ui-kit' --filter '!@nervekit/website' --if-present build

      # Pull requests run the same tests without c8 instrumentation; coverage
      # is collected and uploaded on main only.
      - name: Run complete package test suite
        if: github.event_name == 'pull_request'
        run: pnpm run test:packages

      - name: Run complete package test suite with coverage
        if: github.event_name != 'pull_request'
        run: pnpm run test:packages:coverage

      - name: Upload coverage report
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    name: Browser / Workbench tests
    runs-on: ubuntu-latest
    needs:
      - paths
      - native-linux
    if: ${{ !cancelled() && needs.paths.result == 'success' && needs.native-linux.result == 'success' && needs.paths.outputs.workbench == 'true' }}
    timeout-minutes: 15
    # Official image with Chromium and its system libraries preinstalled (no apt-get or
    # browser download). The tag must match the locked @playwright/test version; the
    # scripts tests in the Lint job assert that (scripts/checks/test/playwright-image.test.ts).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.ts
      - name: Build workbench runtime
        run: pnpm build:workbench-runtime
      - name: Smoke Electron image normalization
        if: needs.paths.outputs.electron_smoke == 'true'
        run: xvfb-run -a node scripts/release/smoke-electron-image-resize.ts
      - name: Smoke built workbench HTTP and WebSocket parity
        run: node scripts/release/smoke-workbench-release.ts
      - name: Run browser tests
        run: pnpm exec playwright test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: Website / Check and build
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.website == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website
        run: pnpm --filter @nervekit/website check
      - name: Test website
        run: pnpm --filter @nervekit/website test
      - name: Build website
        run: pnpm --filter @nervekit/website build

  # One job per OS: install, addon and builds happen once, then the selected
  # suites run as parallel steps (jobs.<job_id>.steps[*].parallel). The suite
  # list comes from the paths job (see scripts/impact/rules.ts) and the steps
  # are shared between the two jobs through a YAML anchor.
  native-tests-windows:
    name: Native / Host and desktop tests (Windows)
    needs:
      - paths
      - native-addon-windows
    if: ${{ !cancelled() && needs.native-addon-windows.result == 'success' && needs.paths.outputs.native_windows_suites != '[]' }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SUITES: ${{ needs.paths.outputs.native_windows_suites }}
    defaults:
      run:
        shell: bash

    steps: &native_test_steps
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        if: contains(fromJSON(env.SUITES), 'native')
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.97.1
      - name: Cache Rust dependencies
        if: contains(fromJSON(env.SUITES), 'native')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-addon-${{ runner.os }}
          path: .native-addon
      - name: Unpack and smoke-load native addon
        shell: bash
        run: |
          mkdir -p packages/native/prebuilds
          tar -xf .native-addon/native-addon.tar -C packages/native/prebuilds
          node scripts/testing/smoke-native-addon.ts

      # Builds run sequentially (shared tsc outputs); each is needed by the
      # selected suites only. The server build also covers tools.
      - name: Build server packages
        if: contains(fromJSON(env.SUITES), 'server') || contains(fromJSON(env.SUITES), 'migrations')
        run: pnpm --filter @nervekit/workbench-server... build
      - name: Build tool packages
        if: contains(fromJSON(env.SUITES), 'tools') && !contains(fromJSON(env.SUITES), 'server') && !contains(fromJSON(env.SUITES), 'migrations')
        run: pnpm --filter @nervekit/tools... build
      - name: Build desktop runtime
        if: contains(fromJSON(env.SUITES), 'desktop')
        run: pnpm build:workbench-runtime && pnpm --filter @nervekit/desktop-shell build

      # cargo fmt and clippy are OS-independent and run once on Ubuntu
      # (the Packages checks); only cargo test and tsx tests run per OS.
      - parallel:
          - name: Run native runtime tests
            if: contains(fromJSON(env.SUITES), 'native')
            run: pnpm --filter @nervekit/native test
          - name: Run native server tests
            if: contains(fromJSON(env.SUITES), 'server')
            timeout-minutes: 8
            run: pnpm --filter @nervekit/workbench-server test:native
          # Same globs as the workbench-server test:migrations script, in two
          # shards (pnpm does not forward extra flags past the script's globs).
          - name: Run storage migration tests on native filesystems (shard 1/2)
            if: contains(fromJSON(env.SUITES), 'migrations')
            run: pnpm --filter @nervekit/workbench-server exec tsx --test --test-concurrency=1 --test-shard=1/2 "src/infrastructure/migrations/**/*.test.ts" "test/infrastructure/persistence/*.test.ts"
          - name: Run storage migration tests on native filesystems (shard 2/2)
            if: contains(fromJSON(env.SUITES), 'migrations')
            run: pnpm --filter @nervekit/workbench-server exec tsx --test --test-concurrency=1 --test-shard=2/2 "src/infrastructure/migrations/**/*.test.ts" "test/infrastructure/persistence/*.test.ts"
          - name: Run tool tests on native Windows filesystems
            if: contains(fromJSON(env.SUITES), 'tools') && runner.os == 'Windows'
            run: pnpm --filter @nervekit/tools test
          - name: Run native tool tests on macOS
            if: contains(fromJSON(env.SUITES), 'tools') && runner.os == 'macOS'
            run: pnpm --filter @nervekit/tools test:native
          - name: Run desktop tests
            if: contains(fromJSON(env.SUITES), 'desktop')
            timeout-minutes: 8
            run: pnpm --filter @nervekit/desktop-shell test

  native-tests-macos:
    name: Native / Host and desktop tests (macOS)
    needs:
      - paths
      - native-addon-macos
    if: ${{ !cancelled() && needs.native-addon-macos.result == 'success' && needs.paths.outputs.native_macos_suites != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      SUITES: ${{ needs.paths.outputs.native_macos_suites }}
    defaults:
      run:
        shell: bash

    steps: *native_test_steps

  native-gate:
    name: Native / Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - paths
      - native-addon-windows
      - native-addon-macos
      - native-tests-windows
      - native-tests-macos

    steps:
      - name: Require successful native host jobs
        shell: bash
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          # Skipped means the OS had no selected suites; anything else but success fails.
          NATIVE_RESULTS: >-
            addon-windows=${{ needs.native-addon-windows.result }}
            addon-macos=${{ needs.native-addon-macos.result }}
            tests-windows=${{ needs.native-tests-windows.result }}
            tests-macos=${{ needs.native-tests-macos.result }}
        run: |
          set -euo pipefail
          if [ "${PATHS_RESULT}" != "success" ]; then
            echo "Native path detection failed: ${PATHS_RESULT}" >&2
            exit 1
          fi
          for entry in ${NATIVE_RESULTS}; do
            result="${entry#*=}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "Native job failed: ${entry}" >&2
              exit 1
            fi
          done
          echo "Native host CI passed: paths=${PATHS_RESULT}, ${NATIVE_RESULTS}"

  gate:
    name: CI / Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - paths
      - lint
      - native-linux
      - validate-check
      - validate-test
      - typecheck
      - package-tests
      - browser-tests
      - website
      - native-gate

    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          PATHS_RESULT: ${{ needs.paths.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          NATIVE_RESULT: ${{ needs.native-gate.result }}
          CONDITIONAL_RESULTS: >-
            native-linux=${{ needs.native-linux.result }}
            validate-check=${{ needs.validate-check.result }}
            validate-test=${{ needs.validate-test.result }}
            typecheck=${{ needs.typecheck.result }}
            package-tests=${{ needs.package-tests.result }}
            browser=${{ needs.browser-tests.result }}
            website=${{ needs.website.result }}
        run: |
          set -euo pipefail
          if [ "${PATHS_RESULT}" != "success" ] || [ "${LINT_RESULT}" != "success" ] || [ "${NATIVE_RESULT}" != "success" ]; then
            echo "Required CI job failed: paths=${PATHS_RESULT}, lint=${LINT_RESULT}, native=${NATIVE_RESULT}" >&2
            exit 1
          fi
          # Conditional jobs are skipped when their area is unaffected. A skip
          # caused by a failed dependency is caught by that dependency's own
          # result (native-linux, paths) above or here.
          for entry in ${CONDITIONAL_RESULTS}; do
            result="${entry#*=}"
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "Conditional CI job failed: ${entry}" >&2
              exit 1
            fi
          done
          echo "CI passed: paths=${PATHS_RESULT}, lint=${LINT_RESULT}, native=${NATIVE_RESULT}, ${CONDITIONAL_RESULTS}"
