name: CodeQL

# Advanced setup. Turn off CodeQL "default setup" in the repository settings,
# otherwise both analyses upload for the same languages.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request cancels its superseded run; other events never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests analyze the languages that change most. Pushes to main add
  # Rust and Python only when the push changed them (each category keeps its
  # last analysis otherwise); the weekly schedule analyzes everything.
  languages:
    name: CodeQL / Select languages
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.select.outputs.list }}

    steps:
      - name: Select languages
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all='["javascript-typescript","actions","python","rust"]'
          list='["javascript-typescript","actions"]'
          if [ "${EVENT}" = "push" ]; then
            # The compare API lists at most 300 files; an unavailable or
            # truncated comparison analyzes everything.
            if files="$(gh api "repos/${GH_REPO}/compare/${BEFORE}...${SHA}" --jq 'if (.files | length) >= 300 then error("truncated") else .files[].filename end' 2>/dev/null)"; then
              extra=""
              if grep -Eq '\.rs$|(^|/)Cargo\.(toml|lock)$' <<<"${files}"; then extra+=',"rust"'; fi
              if grep -Eq '\.py$' <<<"${files}"; then extra+=',"python"'; fi
              list="[\"javascript-typescript\",\"actions\"${extra}]"
            else
              list="${all}"
            fi
          elif [ "${EVENT}" != "pull_request" ]; then
            list="${all}"
          fi
          echo "Languages: ${list}"
          echo "list=${list}" >> "${GITHUB_OUTPUT}"

  analyze:
    name: CodeQL / Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: languages
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
